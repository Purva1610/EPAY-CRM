<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ePay · Accountant ERP</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>



        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f1f5f9;
        }
        .sidebar-link {
            transition: all 0.15s;
            cursor: pointer;
            display: flex !important;
            align-items: center !important;
            gap: 0.75rem !important;
            padding: 0.5rem 0.75rem !important;
            border-radius: 0.5rem !important;
        }
        .sidebar-link:hover {
            background: #1e293b;
        }
        .sidebar-link.active {
            background: #1e3a5f;
            color: white;
        }
        .sidebar-link.active i {
            color: #818cf8;
        }
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 20px;
        }
        .card-hover {
            transition: all 0.2s;
        }
        .card-hover:hover {
            box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0b0f19;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            color: #34d399;
            font-size: 18px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 580px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box input,
        .modal-box select,
        .modal-box textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-top: 6px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-box input:focus,
        .modal-box select:focus,
        .modal-box textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .modal-box label {
            font-weight: 500;
            font-size: 13px;
            color: #334155;
            margin-top: 14px;
            display: block;
        }
        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .modal-box .form-row {
                grid-template-columns: 1fr;
            }
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.completed {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.review {
            background: #e0f2fe;
            color: #0284c7;
        }
        .status-badge.error {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-badge.paid {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.unpaid {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.reconciled {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.unreconciled {
            background: #fee2e2;
            color: #dc2626;
        }
        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            transition: 0.15s;
        }
        .delete-btn:hover {
            color: #dc2626;
            transform: scale(1.1);
        }
        .edit-btn {
            color: #4f46e5;
            cursor: pointer;
            transition: 0.15s;
        }
        .edit-btn:hover {
            color: #4338ca;
        }
        .scrollable-table {
            overflow-x: auto;
        }
        .scrollable-table table {
            min-width: 600px;
        }
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
        }
        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
    <!-- Global Navigation Component -->
    <div id="nav-container"></div>
    <script>
        (function() {
            var navContainer = document.getElementById('nav-container');
            if (navContainer) {
                fetch('navigation-component.html')
                    .then(response => response.text())
                    .then(html => {
                        navContainer.innerHTML = html;
                    })
                    .catch(err => console.error('Navigation load error:', err));
            }
        })();
    </script>
<body>


    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#0b0f19] text-white/80 flex flex-col shrink-0 h-full border-r border-slate-800/60 fixed inset-y-0 left-0 z-50">
        <div class="px-5 py-5 border-b border-slate-800/50 flex items-center gap-3 shrink-0">
            <i class="fa-solid fa-calculator text-indigo-400 text-xl"></i>
            <span class="text-white font-bold tracking-tight">ePay <span class="text-indigo-300">·</span> Accountant</span>
            <span class="ml-auto text-[10px] bg-indigo-600/30 text-indigo-200 px-2 py-0.5 rounded-full">v3</span>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-5 text-sm overflow-y-auto sidebar-nav" id="sidebarNav">
            <!-- rendered by JS -->
        </nav>
        <div class="p-4 border-t border-slate-800/50 text-xs text-slate-400 flex items-center gap-3 shrink-0">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=40&auto=format&fit=crop&q=80" class="w-7 h-7 rounded-full" alt="profile" />
            <div>
                <p class="text-white text-sm font-medium" id="userNameDisplay">Yashraj</p>
                <p class="text-[10px] text-slate-400">Accountant</p>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="ml-64 flex flex-col h-screen overflow-hidden">
        <!-- TOP NAV -->
        <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0">
            <div class="relative w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input id="globalSearch" type="text" placeholder="Search transactions, customers, vendors..." class="w-full bg-slate-50 border border-slate-200 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition" />
            </div>
            <div class="flex items-center gap-4">
                <button id="switchRoleBtn" class="flex items-center gap-2 border border-slate-200 hover:bg-slate-50 text-xs font-semibold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-arrow-right-arrow-left text-indigo-600"></i> Switch</button>
                <div class="relative">
                    <button id="notifBtn" class="p-2 text-slate-600 hover:bg-slate-100 rounded-full transition relative">
                        <i class="fa-regular fa-bell text-lg"></i>
                        <span id="notifBadge" class="absolute -top-0.5 -right-0.5 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">12</span>
                    </button>
                </div>
                <div class="h-6 w-px bg-slate-200"></div>
                <div class="flex items-center gap-2">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80&auto=format&fit=crop&q=80" class="w-8 h-8 rounded-full object-cover ring-2 ring-indigo-300" alt="" />
                </div>
            </div>
        </header>

        <!-- SCROLLABLE MAIN -->
        <main class="flex-1 overflow-y-auto p-5 space-y-6 bg-slate-50/80" id="mainContent">
            <!-- dynamic content -->
        </main>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"><i class="fa-regular fa-circle-check"></i><span id="toastMsg">Done!</span></div>

    <!-- MODAL -->
    <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box" id="modalBox">
            <!-- filled by JS -->
        </div>
    </div>

    <script>
        // ================================================================
        // DATA STORE
        // ================================================================
        const STORAGE_KEY = 'accountantData_v1';
        let AppData = {};

        function initDefaultData() {
            AppData = {
                user: { name: 'Yashraj', role: 'Accountant' },
                transactions: [
                    { id: 1, type: 'Sales', date: '2025-05-14', account: 'Sales Revenue', debit: 0, credit: 25000,
                        amount: 25000, description: 'Invoice #INV-001', customer: 'Art Gallery', vendor: '',
                        status: 'completed', ref: 'INV-001' },
                    { id: 2, type: 'Purchase', date: '2025-05-14', account: 'Inventory', debit: 12000, credit: 0,
                        amount: 12000, description: 'PO #PO-202', customer: '', vendor: 'Canvas Supply Co.',
                        status: 'pending', ref: 'PO-202' },
                    { id: 3, type: 'Payment', date: '2025-05-15', account: 'Bank', debit: 0, credit: 5000,
                        amount: 5000, description: 'Vendor payment', customer: '', vendor: 'Frame World',
                        status: 'completed', ref: 'PAY-003' },
                    { id: 4, type: 'Receipt', date: '2025-05-15', account: 'Bank', debit: 15000, credit: 0,
                        amount: 15000, description: 'Customer payment', customer: 'Modern Arts', vendor: '',
                        status: 'completed', ref: 'REC-004' },
                    { id: 5, type: 'Expense', date: '2025-05-16', account: 'Office Supplies', debit: 3500, credit: 0,
                        amount: 3500, description: 'Stationery', customer: '', vendor: 'OfficeMart',
                        status: 'pending', ref: 'EXP-005' },
                ],
                customers: [
                    { id: 1, name: 'Art Gallery', balance: 25000, email: 'art@example.com' },
                    { id: 2, name: 'Modern Arts', balance: 15000, email: 'modern@example.com' },
                ],
                vendors: [
                    { id: 1, name: 'Canvas Supply Co.', balance: 12000, email: 'canvas@example.com' },
                    { id: 2, name: 'Frame World', balance: 5000, email: 'frame@example.com' },
                ],
                bankAccounts: [
                    { id: 1, name: 'Main Current Account', balance: 450000, lastReconciled: '2025-05-14' },
                ],
                bankTransactions: [
                    { id: 1, date: '2025-05-14', amount: 25000, ref: 'INV-001', status: 'matched' },
                    { id: 2, date: '2025-05-15', amount: 5000, ref: 'PAY-003', status: 'unmatched' },
                ],
                tasks: [
                    { id: 1, title: 'Reconcile bank statement', assigned: '2025-05-15', due: '2025-05-20',
                        priority: 'High', status: 'In Progress' },
                    { id: 2, title: 'Review pending purchase invoices', assigned: '2025-05-16', due: '2025-05-18',
                        priority: 'Medium', status: 'Not Started' },
                ],
                dailyReport: {
                    date: '2025-05-16',
                    transactionsProcessed: 5,
                    salesEntries: 2,
                    purchaseEntries: 1,
                    expenseEntries: 1,
                    paymentEntries: 1,
                    receiptEntries: 1,
                    journalEntries: 0,
                    bankReconciliation: 1,
                    customerReconciliation: 0,
                    vendorReconciliation: 0,
                    errorsFound: 0,
                    errorsCorrected: 0,
                    pendingTransactions: 2,
                    pendingDocuments: 1,
                    escalations: 0,
                    tasksCompleted: 3,
                    tasksPending: 2,
                    remarks: 'All good'
                },
                stats: {}
            };
            updateStats();
            saveData();
        }

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    AppData = JSON.parse(stored);
                    // ensure arrays
                    if (!AppData.transactions) AppData.transactions = [];
                    if (!AppData.customers) AppData.customers = [];
                    if (!AppData.vendors) AppData.vendors = [];
                    if (!AppData.bankAccounts) AppData.bankAccounts = [];
                    if (!AppData.bankTransactions) AppData.bankTransactions = [];
                    if (!AppData.tasks) AppData.tasks = [];
                    if (!AppData.dailyReport) AppData.dailyReport = {};
                    if (!AppData.stats) AppData.stats = {};
                    if (!AppData.user) AppData.user = { name: 'Yashraj', role: 'Accountant' };
                    updateStats();
                    saveData();
                } else {
                    initDefaultData();
                    saveData();
                }
            } catch (e) {
                console.warn('Data load error, resetting', e);
                initDefaultData();
                saveData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(AppData));
            } catch (e) {}
        }

        function updateStats() {
            const t = AppData.transactions || [];
            const today = new Date().toISOString().slice(0, 10);
            const todayTx = t.filter(tx => tx.date === today);
            const pending = t.filter(tx => tx.status === 'pending');
            const errors = t.filter(tx => tx.status === 'error');
            AppData.stats = {
                transactionsAssigned: t.length,
                transactionsCompleted: t.filter(tx => tx.status === 'completed').length,
                transactionsPending: pending.length,
                transactionsUnderReview: t.filter(tx => tx.status === 'review').length,
                salesEntries: t.filter(tx => tx.type === 'Sales').length,
                purchaseEntries: t.filter(tx => tx.type === 'Purchase').length,
                expenseEntries: t.filter(tx => tx.type === 'Expense').length,
                paymentEntries: t.filter(tx => tx.type === 'Payment').length,
                receiptEntries: t.filter(tx => tx.type === 'Receipt').length,
                journalEntries: t.filter(tx => tx.type === 'Journal').length,
                bankEntries: t.filter(tx => tx.account === 'Bank').length,
                reconciliationTasks: AppData.bankTransactions ? AppData.bankTransactions.filter(bt => bt.status ===
                    'unmatched').length : 0,
                errorsFound: errors.length,
                correctionsPending: pending.length,
                totalRevenueEntries: t.filter(tx => tx.type === 'Sales' || tx.type === 'Receipt').length,
                totalExpenseEntries: t.filter(tx => tx.type === 'Expense' || tx.type === 'Purchase').length,
                totalPaymentEntries: t.filter(tx => tx.type === 'Payment').length,
                totalReceiptEntries: t.filter(tx => tx.type === 'Receipt').length,
                reconciliationPercent: AppData.bankTransactions ? Math.round((AppData.bankTransactions.filter(bt =>
                    bt.status === 'matched').length / AppData.bankTransactions.length) * 100) : 0,
                errorPercent: t.length ? Math.round((errors.length / t.length) * 100) : 0,
                pendingTransactions: pending.length,
                completedTasks: AppData.tasks ? AppData.tasks.filter(task => task.status === 'Completed').length : 0,
                monthlyTotal: t.length,
            };
            saveData();
        }

        // ================================================================
        // SIDEBAR
        // ================================================================
        const menuStructure = [
            { section: 'Overview', items: [{ id: 'dashboard', label: 'Dashboard', icon: 'fa-house' }] },
            { section: 'Accounting', items: [
                    { id: 'transactions', label: 'My Transactions', icon: 'fa-regular fa-receipt' },
                    { id: 'ledger', label: 'General Ledger', icon: 'fa-regular fa-book' },
                    { id: 'journal', label: 'Journal Entries', icon: 'fa-regular fa-pen-to-square' },
                ] },
            { section: 'Sales', items: [
                    { id: 'sales-invoices', label: 'Sales Invoices', icon: 'fa-regular fa-file-invoice' },
                    { id: 'sales-reconciliation', label: 'Sales Reconciliation', icon: 'fa-regular fa-check-double' },
                ] },
            { section: 'Purchases', items: [
                    { id: 'purchase-invoices', label: 'Purchase Invoices', icon: 'fa-regular fa-file-invoice' },
                    { id: 'purchase-reconciliation', label: 'Purchase Reconciliation', icon: 'fa-regular fa-check-double' },
                ] },
            { section: 'Receipts', items: [
                    { id: 'receipts', label: 'Customer Receipts', icon: 'fa-regular fa-hand-holding-usd' },
                ] },
            { section: 'Payments', items: [
                    { id: 'payments', label: 'Vendor Payments', icon: 'fa-regular fa-credit-card' },
                ] },
            { section: 'Expenses', items: [
                    { id: 'expenses', label: 'Expense Entries', icon: 'fa-regular fa-coins' },
                ] },
            { section: 'Bank', items: [
                    { id: 'bank', label: 'Bank Reconciliation', icon: 'fa-regular fa-building-columns' },
                ] },
            { section: 'Customers', items: [
                    { id: 'customer-ledger', label: 'Customer Ledger', icon: 'fa-regular fa-user' },
                ] },
            { section: 'Vendors', items: [
                    { id: 'vendor-ledger', label: 'Vendor Ledger', icon: 'fa-regular fa-user-tie' },
                ] },
            { section: 'Tasks', items: [
                    { id: 'tasks', label: 'My Tasks', icon: 'fa-regular fa-list-check' },
                    { id: 'daily-report', label: 'Daily Report', icon: 'fa-regular fa-file-lines' },
                ] },
            { section: 'Settings', items: [
                    { id: 'settings', label: 'Settings', icon: 'fa-regular fa-gear' },
                ] },
        ];

        let currentPage = 'dashboard';

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';
            menuStructure.forEach(group => {
                const div = document.createElement('div');
                const label = document.createElement('span');
                label.className = 'text-[10px] uppercase tracking-wider text-slate-500 font-semibold';
                label.textContent = group.section;
                div.appendChild(label);
                const ul = document.createElement('ul');
                ul.className = 'mt-2 space-y-1';
                group.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className =
                        `sidebar-link ${currentPage === item.id ? 'active' : ''}`;
                    li.dataset.page = item.id;
                    li.innerHTML = `<i class="${item.icon} w-4"></i>${item.label}`;
                    li.addEventListener('click', () => navigateTo(item.id));
                    ul.appendChild(li);
                });
                div.appendChild(ul);
                nav.appendChild(div);
            });
        }

        function navigateTo(pageId) {
            currentPage = pageId;
            renderSidebar();
            renderPage(pageId);
        }

        // ================================================================
        // PAGE RENDERER
        // ================================================================
        function renderPage(pageId) {
            const main = document.getElementById('mainContent');
            if (!main) return;
            main.className = 'flex-1 overflow-y-auto p-5 space-y-6 bg-slate-50/80 fade-in';
            updateStats();
            switch (pageId) {
                case 'dashboard':
                    renderDashboard(main);
                    break;
                case 'transactions':
                    renderTransactions(main);
                    break;
                case 'sales-invoices':
                    renderSalesInvoices(main);
                    break;
                case 'purchase-invoices':
                    renderPurchaseInvoices(main);
                    break;
                case 'receipts':
                    renderReceipts(main);
                    break;
                case 'payments':
                    renderPayments(main);
                    break;
                case 'expenses':
                    renderExpenses(main);
                    break;
                case 'bank':
                    renderBank(main);
                    break;
                case 'customer-ledger':
                    renderCustomerLedger(main);
                    break;
                case 'vendor-ledger':
                    renderVendorLedger(main);
                    break;
                case 'tasks':
                    renderTasks(main);
                    break;
                case 'daily-report':
                    renderDailyReport(main);
                    break;
                case 'ledger':
                    renderLedger(main);
                    break;
                case 'journal':
                    renderJournal(main);
                    break;
                case 'sales-reconciliation':
                case 'purchase-reconciliation':
                    renderReconciliation(main, pageId);
                    break;
                default:
                    renderDashboard(main);
            }
        }

        // ---------- DASHBOARD ----------
        function renderDashboard(container) {
            const s = AppData.stats;
            container.innerHTML = `
            <section class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-6 gap-3">
              ${[
                ['Assigned', s.transactionsAssigned, 'fa-receipt', 'indigo'],
                ['Completed', s.transactionsCompleted, 'fa-check-circle', 'emerald'],
                ['Pending', s.transactionsPending, 'fa-clock', 'amber'],
                ['Under Review', s.transactionsUnderReview, 'fa-eye', 'sky'],
                ['Sales', s.salesEntries, 'fa-chart-simple', 'blue'],
                ['Purchases', s.purchaseEntries, 'fa-cart-shopping', 'purple'],
                ['Expenses', s.expenseEntries, 'fa-coins', 'rose'],
                ['Payments', s.paymentEntries, 'fa-credit-card', 'teal'],
                ['Receipts', s.receiptEntries, 'fa-hand-holding-usd', 'green'],
                ['Journal', s.journalEntries, 'fa-pen', 'amber'],
                ['Bank Entries', s.bankEntries, 'fa-building-columns', 'cyan'],
                ['Reconciliation', s.reconciliationTasks, 'fa-check-double', 'violet'],
                ['Errors', s.errorsFound, 'fa-circle-exclamation', 'red'],
                ['Corrections', s.correctionsPending, 'fa-pen-to-square', 'orange'],
              ].map(([label, value, icon, color]) => `
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm card-hover">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-${color}-50 text-${color}-600 flex items-center justify-center"><i class="fa-regular ${icon}"></i></div>
                    <div><p class="text-[10px] text-slate-400">${label}</p><h4 class="font-bold text-sm">${value}</h4></div>
                  </div>
                </div>
              `).join('')}
            </section>

            <!-- Monthly summary -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-400">Monthly Transactions</p><h3 class="text-2xl font-bold">${s.monthlyTotal}</h3></div>
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-400">Reconciliation %</p><h3 class="text-2xl font-bold">${s.reconciliationPercent}%</h3><div class="w-full bg-slate-200 rounded-full h-2 mt-1"><div class="bg-indigo-600 rounded-full h-2" style="width:${s.reconciliationPercent}%"></div></div></div>
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><p class="text-xs text-slate-400">Error Rate</p><h3 class="text-2xl font-bold">${s.errorPercent}%</h3></div>

        // ================================================================
        // CRUD OPERATIONS
        // ================================================================
        function addTransaction(data) {
            AppData.transactions.push({
                id: Date.now(),
                date: data.date || new Date().toISOString().slice(0, 10),
                type: data.type || 'Sales',
                account: data.account || 'Revenue',
                debit: data.debit || 0,
                credit: data.credit || 0,
                amount: data.amount || 0,
                description: data.description || '',
                customer: data.customer || '',
                vendor: data.vendor || '',
                status: data.status || 'pending',
                ref: data.ref || 'TXN' + Date.now().toString().slice(-6),
            });
            saveData();
            renderPage(currentPage);
            showToast('✅ Transaction created');
        }

        function editTransaction(id) {
            const tx = AppData.transactions.find(t => t.id === id);
            if (!tx) return;
            openModal('editTransaction', tx);
        }

        function saveEditTransaction(id, data) {
            const tx = AppData.transactions.find(t => t.id === id);
            if (!tx) return;
            Object.assign(tx, data);
            saveData();
            renderPage(currentPage);
            showToast('✅ Transaction updated');
        }

        function deleteTransaction(id) {
            if (!confirm('Delete this transaction?')) return;
            AppData.transactions = AppData.transactions.filter(t => t.id !== id);
            saveData();
            renderPage(currentPage);
            showToast('🗑️ Deleted');
        }

        // ================================================================
        // MODAL SYSTEM
        // ================================================================
        function openModal(action, data = null) {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            let html = '';
            const closeBtn = `<button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>`;

            if (action === 'transaction' || action === 'editTransaction') {
                const isEdit = action === 'editTransaction';
                const tx = data || {};
                html = `
              <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-slate-800">${isEdit ? 'Edit' : 'New'} Transaction</h3>${closeBtn}</div>
              <div class="form-row"><div><label>Date</label><input type="date" id="modalDate" value="${tx.date || new Date().toISOString().slice(0,10)}" /></div><div><label>Type</label><select id="modalType"><option ${tx.type==='Sales'?'selected':''}>Sales</option><option ${tx.type==='Purchase'?'selected':''}>Purchase</option><option ${tx.type==='Expense'?'selected':''}>Expense</option><option ${tx.type==='Payment'?'selected':''}>Payment</option><option ${tx.type==='Receipt'?'selected':''}>Receipt</option><option ${tx.type==='Journal'?'selected':''}>Journal</option></select></div></div>
              <label>Account</label><input id="modalAccount" value="${tx.account || ''}" placeholder="Account name" />
              <div class="form-row"><div><label>Debit</label><input type="number" id="modalDebit" value="${tx.debit || 0}" /></div><div><label>Credit</label><input type="number" id="modalCredit" value="${tx.credit || 0}" /></div></div>
              <label>Amount</label><input type="number" id="modalAmount" value="${tx.amount || 0}" />
              <label>Description</label><input id="modalDescription" value="${tx.description || ''}" />
              <div class="form-row"><div><label>Customer</label><input id="modalCustomer" value="${tx.customer || ''}" /></div><div><label>Vendor</label><input id="modalVendor" value="${tx.vendor || ''}" /></div></div>
              <label>Reference</label><input id="modalRef" value="${tx.ref || ''}" />
              <label>Status</label><select id="modalStatus"><option ${tx.status==='pending'?'selected':''}>pending</option><option ${tx.status==='completed'?'selected':''}>completed</option><option ${tx.status==='review'?'selected':''}>review</option><option ${tx.status==='error'?'selected':''}>error</option></select>
              <div class="mt-6 flex gap-3 justify-end"><button onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50">Cancel</button><button onclick="${isEdit ? `submitEditTransaction(${tx.id})` : 'submitTransaction()'}" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">${isEdit ? 'Save' : 'Create'}</button></div>
            `;
                box.innerHTML = html;
                overlay.classList.add('active');
            } else {
                closeModal();
            }
        }

        function submitTransaction() {
            const data = {
                date: document.getElementById('modalDate')?.value || new Date().toISOString().slice(0, 10),
                type: document.getElementById('modalType')?.value || 'Sales',
                account: document.getElementById('modalAccount')?.value || '',
                debit: parseFloat(document.getElementById('modalDebit')?.value) || 0,
                credit: parseFloat(document.getElementById('modalCredit')?.value) || 0,
                amount: parseFloat(document.getElementById('modalAmount')?.value) || 0,
                description: document.getElementById('modalDescription')?.value || '',
                customer: document.getElementById('modalCustomer')?.value || '',
                vendor: document.getElementById('modalVendor')?.value || '',
                ref: document.getElementById('modalRef')?.value || 'TXN' + Date.now().toString().slice(-6),
                status: document.getElementById('modalStatus')?.value || 'pending',
            };
            addTransaction(data);
            closeModal();
        }

        function submitEditTransaction(id) {
            const data = {
                date: document.getElementById('modalDate')?.value || new Date().toISOString().slice(0, 10),
                type: document.getElementById('modalType')?.value || 'Sales',
                account: document.getElementById('modalAccount')?.value || '',
                debit: parseFloat(document.getElementById('modalDebit')?.value) || 0,
                credit: parseFloat(document.getElementById('modalCredit')?.value) || 0,
                amount: parseFloat(document.getElementById('modalAmount')?.value) || 0,
                description: document.getElementById('modalDescription')?.value || '',
                customer: document.getElementById('modalCustomer')?.value || '',
                vendor: document.getElementById('modalVendor')?.value || '',
                ref: document.getElementById('modalRef')?.value || '',
                status: document.getElementById('modalStatus')?.value || 'pending',
            };
            saveEditTransaction(id, data);
            closeModal();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ================================================================
        // UTILITY
        // ================================================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function quickAction(action) {
            showToast('⚡ ' + action);
            if (action.includes('New Sales Invoice') || action.includes('New Purchase Invoice') || action.includes(
                    'New Receipt') || action.includes('New Payment') || action.includes('New Expense') || action.includes(
                    'New Journal Entry')) {
                openModal('transaction');
            }
            if (action === 'Reconcile Bank') {
                showToast('🔍 Bank reconciliation initiated');
            }
            if (action === 'Submit Daily Report') {
                showToast('✅ Daily report submitted');
            }
            if (action === 'Complete Task') {
                showToast('✅ Task marked complete');
            }
        }

        // ================================================================
        // SEARCH
        // ================================================================
        document.getElementById('globalSearch').addEventListener('input', function(e) {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { renderPage(currentPage); return; }
            const txs = AppData.transactions.filter(tx => tx.description.toLowerCase().includes(q) || tx.customer
                .toLowerCase().includes(q) || tx.vendor.toLowerCase().includes(q));
            showToast(`🔍 Found ${txs.length} transactions`);
        });

        // ================================================================
        // NOTIFICATIONS
        // ================================================================
        document.getElementById('notifBtn').addEventListener('click', function() {
            const badge = document.getElementById('notifBadge');
            if (badge.textContent !== '0') {
                badge.textContent = '0';
                showToast('📬 Notifications cleared');
            } else {
                showToast('🔔 No new notifications');
            }
        });

        // ================================================================
        // SWITCH ROLE
        // ================================================================
        document.getElementById('switchRoleBtn').addEventListener('click', function() {
            const name = document.getElementById('userNameDisplay');
            if (name.textContent === 'Yashraj') {
                name.textContent = 'Admin';
                showToast('🔄 Switched to Admin');
            } else {
                name.textContent = 'Yashraj';
                showToast('🔄 Switched to Accountant');
            }
        });

        // ================================================================
        // INIT
        // ================================================================
        loadData();
        renderSidebar();
        renderPage('dashboard');

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 Accountant ERP loaded');
        console.log('💾 Data:', AppData);
    </script>

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
