services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
    container_name: epay-crm
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  crm-dev:
    image: node:20-alpine
    container_name: epay-crm-dev
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-localhost}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-epay-crm-dev}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-epay-crm-dev.appspot.com}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-123456789}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-1:123456789:web:abcdef}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    profiles:
      - dev

  firebase-emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    container_name: epay-crm-emulator
    ports:
      - "4000:4000"
      - "8081:8080"
      - "9000:9000"
      - "9099:9099"
    volumes:
      - ./firebase.json:/firebase.json
      - ./firestore.rules:/firestore.rules
      - ./firestore.indexes.json:/firestore.indexes.json
      - ./firebase-rtdb-rules.json:/firebase-rtdb-rules.json
      - emulator-data:/data
    command: firebase emulators:start --project=${FIREBASE_PROJECT_ID:-epay-crm-dev} --import=/data --export-on-exit
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-epay-crm-dev}
    restart: unless-stopped
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    profiles:
      - dev

networks:
  crm-network:
    driver: bridge

volumes:
  emulator-data:
