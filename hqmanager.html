        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f1f5f9;
        }
        .sidebar-link {
            transition: all 0.15s;
            cursor: pointer;
            display: flex !important;
            align-items: center !important;
            gap: 0.75rem !important;
            padding: 0.5rem 0.75rem !important;
            border-radius: 0.5rem !important;
        }
        .sidebar-link:hover {
            background: #1e293b;
        }
        .sidebar-link.active {
            background: #1e3a5f;
            color: white;
        }
        .sidebar-link.active i {
            color: #818cf8;
        }
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 20px;
        }
        .card-hover {
            transition: all 0.2s;
        }
        .card-hover:hover {
            box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0b0f19;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            color: #34d399;
            font-size: 18px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 600px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box input,
        .modal-box select,
        .modal-box textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-top: 6px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-box input:focus,
        .modal-box select:focus,
        .modal-box textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .modal-box label {
            font-weight: 500;
            font-size: 13px;
            color: #334155;
            margin-top: 14px;
            display: block;
        }
        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .modal-box .form-row {
                grid-template-columns: 1fr;
            }
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.pending {

            color: #dc2626;
        }
        .status-badge.approved {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.critical {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-badge.warning {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.positive {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.active {
            background: #dcfce7;
            color: #16a34a;

        .status-badge.inactive {

            color: #dc2626;

            color: #dc2626;

            color: #d97706;

        }

        }
        .chart-bar {
            height: 8px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .chart-bar .fill {
            height: 100%;
            border-radius: 999px;
        }
        .progress-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            position: relative;
        }
        .progress-ring .bg {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(var(--color) var(--pct), #e2e8f0 var(--pct));
        }
        .progress-ring .inner {
            position: relative;
            z-index: 2;
            background: white;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #0b0f19;

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    AppData = JSON.parse(stored);
                    // Ensure arrays
                    if (!AppData.districts) AppData.districts = [];
                    if (!AppData.galleries) AppData.galleries = [];
                    if (!AppData.employees) AppData.employees = [];
                    if (!AppData.tasks) AppData.tasks = [];
                    if (!AppData.visits) AppData.visits = [];
                    if (!AppData.leads) AppData.leads = [];
                    if (!AppData.collections) AppData.collections = [];
                    if (!AppData.dailyReports) AppData.dailyReports = [];
                    if (!AppData.complaints) AppData.complaints = [];
                    if (!AppData.stats) AppData.stats = {};
                    if (!AppData.user) AppData.user = { name: 'Anand', role: 'HQ Manager' };
                    if (!AppData.hq) AppData.hq = { id: 1, name: 'HQ North', region: 'North' };
                    updateStats();
                    saveData();
                } else {
                    initDefaultData();
                    saveData();
                }
            } catch (e) {
                console.warn('Data load error, resetting', e);
                initDefaultData();
                saveData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(AppData));
            } catch (e) {}
        }

        function updateStats() {
            const districts = AppData.districts || [];
            const galleries = AppData.galleries || [];
            const employees = AppData.employees || [];
            const tasks = AppData.tasks || [];
            const visits = AppData.visits || [];
            const leads = AppData.leads || [];
            const collections = AppData.collections || [];
            const complaints = AppData.complaints || [];
            const dailyReports = AppData.dailyReports || [];

            const totalRevenue = galleries.reduce((s, g) => s + g.revenue, 0);
            const totalTarget = galleries.reduce((s, g) => s + g.target, 0);
            const totalEmployees = employees.length;
            const present = employees.filter(e => e.present).length;
            const absent = totalEmployees - present;
            const totalGalleries = galleries.length;
            const totalDistricts = districts.length;
            const totalLeads = leads.length;
            const totalCollections = collections.reduce((s, c) => s + (c.status === 'Paid' ? c.amount : 0), 0);
            const totalOutstanding = collections.reduce((s, c) => s + (c.status === 'Overdue' ? c.amount : 0), 0);
            const pendingTasks = tasks.filter(t => t.status === 'Pending').length;
            const overdueTasks = tasks.filter(t => t.status === 'Pending' && t.due < new Date().toISOString().slice(0, 10))
                .length;
            const criticalIssues = complaints.filter(c => c.priority === 'High' && c.status !== 'Resolved').length;
            const visitsCompleted = visits.filter(v => v.status === 'Completed').length;
            const visitsPlanned = visits.length;
            const reportsSubmitted = dailyReports.filter(r => r.status === 'Submitted').length;

            AppData.stats = {
                assignedHQ: AppData.hq ? AppData.hq.name : '—',
                galleries: totalGalleries,
                teamMembers: totalEmployees,
                present: present,
                absent: absent,
                todayRevenue: 450000, // simulated
                monthlyRevenue: totalRevenue,
                target: totalTarget,
                achievement: totalTarget ? Math.round((totalRevenue / totalTarget) * 100) : 0,
                newCustomers: 45,
                newLeads: totalLeads,
                todayVisits: visitsCompleted,
                collections: totalCollections,
                outstanding: totalOutstanding,
                pendingTasks: pendingTasks,
                criticalIssues: criticalIssues,
                overdueTasks: overdueTasks,
                visitsPlanned: visitsPlanned,
                visitsCompleted: visitsCompleted,
                reportsSubmitted: reportsSubmitted,
                reportsExpected: employees.filter(e => e.dailyReport !== undefined).length,
            };
            saveData();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';
            menuStructure.forEach(group => {
                const div = document.createElement('div');
                const label = document.createElement('span');
                label.className = 'text-[10px] uppercase tracking-wider text-slate-500 font-semibold';
                label.textContent = group.section;
                div.appendChild(label);
                const ul = document.createElement('ul');
                ul.className = 'mt-2 space-y-1';
                group.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className =
                        `sidebar-link ${currentPage === item.id ? 'active' : ''}`;
                    li.dataset.page = item.id;
                    li.innerHTML = `<i class="${item.icon} w-4"></i>${item.label}`;
                    li.addEventListener('click', () => {
                        drillContext = null;
                        navigateTo(item.id);
                    });
                    ul.appendChild(li);
                });
                div.appendChild(ul);
                nav.appendChild(div);
            });
        }

            currentPage = pageId;
            renderSidebar();
            renderPage(pageId);

                  <tr><td>${c.customer}</td><td>₹${formatNum(c.amount)}</td><td>${c.date}</td><td><span class="status-badge ${c.status === 'Paid' ? 'positive' : c.status === 'Overdue' ? 'critical' : 'pending'}">${c.status}</span></td></tr>
                `).join('')}</tbody></table></div>
            </div>
          `;
        }

        // ---------- COMPLAINTS ----------
        function renderComplaints(container) {
            const complaints = AppData.complaints;
            const galleries = AppData.galleries;
            container.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
              <h2 class="font-bold text-lg text-slate-800"><i class="fa-regular fa-message mr-2 text-rose-500"></i>Complaints</h2>
              <div class="overflow-x-auto mt-4"><table class="w-full text-sm"><thead><tr class="text-slate-400 border-b"><th class="pb-3 text-left">Customer</th><th class="pb-3 text-left">Issue</th><th class="pb-3 text-left">Gallery</th><th class="pb-3 text-left">Priority</th><th class="pb-3 text-left">Status</th></tr></thead>
                <tbody>${complaints.map(c => {
                  const gallery = galleries.find(g => g.id === c.galleryId);
                  return `<tr><td>${c.customer}</td><td>${c.issue}</td><td>${gallery ? gallery.name : '—'}</td><td><span class="status-badge ${c.priority.toLowerCase()}">${c.priority}</span></td><td><span class="status-badge ${c.status === 'Resolved' ? 'positive' : c.status === 'In Progress' ? 'warning' : 'error'}">${c.status}</span></td></tr>`;
                }).join('')}</tbody></table></div>
            </div>
          `;
        }

        // ---------- ALERTS ----------
        function renderAlerts(container) {
            container.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
              <h2 class="font-bold text-lg text-slate-800"><i class="fa-regular fa-triangle-exclamation mr-2 text-amber-500"></i>Operational Alerts</h2>
              <div class="space-y-3 mt-4">
                <div class="flex items-start gap-3 border-b pb-3"><span class="status-badge critical">Critical</span><div><p class="font-medium">Gallery Alpha target below 70%</p><p class="text-xs text-slate-400">Revenue: ₹6,00,000 vs Target ₹7,00,000</p></div></div>
                <div class="flex items-start gap-3 border-b pb-3"><span class="status-badge warning">Warning</span><div><p class="font-medium">Low attendance in District B</p><p class="text-xs text-slate-400">5 employees absent today</p></div></div>
                <div class="flex items-start gap-3 border-b pb-3"><span class="status-badge warning">Warning</span><div><p class="font-medium">3 overdue tasks</p><p class="text-xs text-slate-400">Review district sales report overdue by 2 days</p></div></div>
                <div class="flex items-start gap-3"><span class="status-badge positive">Positive</span><div><p class="font-medium">Gallery Beta achieved 105% revenue</p><p class="text-xs text-slate-400">Revenue: ₹7,50,000 vs Target ₹7,00,000</p></div></div>
              </div>
            </div>
          `;
        }

        // ================================================================
        // MODAL (simple task creation)
        // ================================================================
        function openModal(action, data = null) {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            let html = '';
            const closeBtn = `<button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>`;

            if (action === 'task') {
                html = `
              <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-slate-800">Create Task</h3>${closeBtn}</div>
              <label>Title</label><input id="taskTitle" placeholder="Task title" />
              <div class="form-row"><div><label>Assigned To</label><input id="taskAssigned" placeholder="Employee name" /></div><div><label>Due Date</label><input type="date" id="taskDue" value="${new Date().toISOString().slice(0,10)}" /></div></div>
              <div class="form-row"><div><label>Priority</label><select id="taskPriority"><option>High</option><option>Medium</option><option>Low</option></select></div><div><label>Category</label><input id="taskCategory" placeholder="e.g. Visit, Reporting" /></div></div>
              <div class="mt-6 flex gap-3 justify-end"><button onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50">Cancel</button><button onclick="submitTask()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">Create</button></div>
            `;
                box.innerHTML = html;
                overlay.classList.add('active');
            } else {
                closeModal();
            }
        }

        function submitTask() {
            const title = document.getElementById('taskTitle')?.value || 'New Task';
            const assignedTo = document.getElementById('taskAssigned')?.value || 'Unassigned';
            const due = document.getElementById('taskDue')?.value || new Date().toISOString().slice(0, 10);
            const priority = document.getElementById('taskPriority')?.value || 'Medium';
            const category = document.getElementById('taskCategory')?.value || 'General';
            AppData.tasks.push({
                id: Date.now(),
                title,
                assignedTo,
                due,
                priority,
                status: 'Pending',
                category
            });
            saveData();
            renderPage(currentPage);
            showToast('✅ Task created');
            closeModal();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ================================================================
        // UTILITY
        // ================================================================
        function formatNum(n) {
            if (n >= 10000000) return (n / 10000000).toFixed(1) + 'Cr';
            if (n >= 100000) return (n / 100000).toFixed(1) + 'L';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return n;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function quickAction(action) {
            showToast('⚡ ' + action);
            if (action.includes('Create Task')) openModal('task');
            else if (action.includes('Assign Task')) openModal('task');
            else if (action.includes('View Team')) navigateTo('team');
            else if (action.includes('View Field Visits')) navigateTo('field-visits');
            else if (action.includes('View Reports')) navigateTo('daily-reports');
            else if (action.includes('View Alerts')) navigateTo('alerts');
        }

        function drill(label) {
            showToast('🔍 Drilling into: ' + label);
            if (label.includes('Gallery')) navigateTo('galleries');
            else if (label.includes('District')) navigateTo('districts');
            else if (label.includes('Team')) navigateTo('team');
            else if (label.includes('Lead')) navigateTo('leads');
            else if (label.includes('Task')) navigateTo('tasks');
            else if (label.includes('Visit')) navigateTo('field-visits');
            else if (label.includes('Collection')) navigateTo('collections');
            else if (label.includes('Complaint')) navigateTo('complaints');
            else if (label.includes('Sales')) navigateTo('sales');
        }

        // ================================================================
        // SEARCH
        // ================================================================
        document.getElementById('globalSearch').addEventListener('input', function(e) {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { renderPage(currentPage); return; }
            const all = [...AppData.galleries, ...AppData.employees, ...AppData.districts, ...AppData.tasks];
            const results = all.filter(item => JSON.stringify(item).toLowerCase().includes(q));
            showToast(`🔍 Found ${results.length} matches`);
        });

        // ================================================================
        // NOTIFICATIONS
        // ================================================================
        document.getElementById('notifBtn').addEventListener('click', function() {
            const badge = document.getElementById('notifBadge');
            if (badge.textContent !== '0') {
                badge.textContent = '0';
                showToast('📬 Notifications cleared');
            } else {
                showToast('🔔 No new notifications');
            }
        });

        // ================================================================
        // SWITCH ROLE
        // ================================================================
        document.getElementById('switchRoleBtn').addEventListener('click', function() {
            const name = document.getElementById('userNameDisplay');
            if (name.textContent === 'Anand') {
                name.textContent = 'Admin';
                showToast('🔄 Switched to Admin');
            } else {
                name.textContent = 'Anand';
                showToast('🔄 Switched to HQ Manager');
            }
        });

        // ================================================================
        // INIT
        // ================================================================
        loadData();
        renderSidebar();
        renderPage('dashboard');

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 HQ Manager Dashboard loaded');
        console.log('💾 Data:', AppData);
    </script>
    <!-- ====== LOGOUT BUTTON & SESSION TIMER ====== -->
    

    <style>



    .crm-logout-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: all 0.3s ease;
        text-align: center;
        min-width: 80px;
    }

    .crm-logout-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .crm-logout-btn:active {
        transform: translateY(0);
    }

    .crm-logout-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

    <!-- CRM Services -->
    <script src="session-timer-service.js"></script>
    <script src="email-service.js"></script>
    <script src="calling-service.js"></script>
    <script src="firebase-init.js"></script>

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
