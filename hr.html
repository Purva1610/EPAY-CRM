<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR+ · Enterprise HR ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js">
    </script>
    <style>
        /* ─── CSS VARIABLES ─── */
        :root {
            --primary: #0b8f6c;
            --primary-dark: #067a5a;
            --primary-light: #34d399;
            --primary-glow: rgba(11, 143, 108, 0.25);
            --secondary: #0ea5e9;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --sidebar-width: 264px;
            --header-height: 68px;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.10);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--gray-100);
            color: var(--gray-800);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        /* ─── SIDEBAR ─── */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--gray-900);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: transform var(--transition);
            overflow-y: auto;
            padding: 0 0 16px 0;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
        }
        #sidebar .brand {
            padding: 20px 24px 16px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #sidebar .brand i {
            color: var(--primary-light);
            font-size: 28px;
        }
        #sidebar .brand span {
            color: #fff;
        }
        #sidebar .brand small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.4;
            margin-left: auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .nav-section {
            padding: 18px 24px 6px 24px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.35;
            font-weight: 600;
            color: #a0aec0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 9px 20px;
            margin: 1px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            color: #94a3b8;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            position: relative;
            user-select: none;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .nav-item.active {
            background: rgba(16, 185, 129, 0.18);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.15);
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12%;
            height: 76%;
            width: 3px;
            background: var(--primary-light);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .nav-item .badge {
            margin-left: auto;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            padding: 1px 9px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .nav-item .badge.green {
            background: var(--success);
        }
        .nav-item .badge.warning {
            background: var(--warning);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .sidebar-footer .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(11, 143, 108, 0.3);
        }
        .sidebar-footer .info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-footer .info .name {
            color: #fff;
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .info .role {
            font-size: 11px;
            opacity: 0.45;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .logout-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 17px;
            transition: var(--transition);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-footer .logout-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        /* ─── MAIN ─── */
        #main {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--gray-50);
        }

        /* ─── HEADER ─── */
        #header {
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        #header .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--gray-700);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        #header .hamburger:hover {
            background: var(--gray-100);
        }
        #header .page-title {
            font-size: 19px;
            font-weight: 600;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-900);
        }
        #header .page-title small {
            font-weight: 400;
            color: var(--gray-500);
            font-size: 13px;
            margin-left: 4px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .search-box {
            display: flex;
            align-items: center;
            background: var(--gray-100);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            gap: 8px;
            border: 1px solid transparent;
            transition: all var(--transition);
        }
        .header-actions .search-box:focus-within {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .header-actions .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            padding: 6px 0;
            width: 160px;
            color: var(--gray-700);
            font-family: var(--font);
        }
        .header-actions .search-box input::placeholder {
            color: var(--gray-400);
        }
        .header-actions .search-box i {
            color: var(--gray-400);
            font-size: 14px;
        }
        .header-actions .notif {
            position: relative;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--gray-600);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .header-actions .notif:hover {
            background: var(--gray-100);
        }
        .header-actions .notif .dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 9px;
            height: 9px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid #fff;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* ─── PAGE CONTENT ─── */
        #pageContent {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 40px;
        }

        /* ─── STATS GRID ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: var(--transition);
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .stat-card .label {
            font-size: 12.5px;
            color: var(--gray-500);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-card .label i {
            font-size: 14px;
            opacity: 0.7;
        }
        .stat-card .value {
            font-size: 30px;
            font-weight: 700;
            margin-top: 2px;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .stat-card .change {
            font-size: 11.5px;
            font-weight: 500;
            margin-top: 6px;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            background: var(--gray-100);
        }
        .stat-card .change.up {
            color: var(--success);
            background: #dcfce7;
        }
        .stat-card .change.down {
            color: var(--danger);
            background: #fee2e2;
        }
        .stat-card .change.neutral {
            color: var(--gray-500);
            background: var(--gray-100);
        }

        /* ─── SECTION HEADER ─── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 28px 0 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-header h2 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray-800);
        }
        .section-header h2 i {
            color: var(--primary);
        }
        .section-header h2 .sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--gray-500);
            margin-left: 4px;
        }

        /* ─── BUTTONS ─── */
        .btn {
            padding: 8px 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            background: var(--gray-200);
            color: var(--gray-700);
            font-family: var(--font);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-warning:hover {
            background: #ca8a04;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 11.5px;
            border-radius: 6px;
        }
        .btn-xs {
            padding: 2px 10px;
            font-size: 10px;
            border-radius: 4px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-600);
        }
        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }
        .btn-ghost {
            background: transparent;
            color: var(--gray-600);
        }
        .btn-ghost:hover {
            background: var(--gray-100);
        }

        /* ─── TABLE ─── */
        .table-wrap {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .table-scroll {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        table th {
            background: var(--gray-50);
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        table td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
            color: var(--gray-700);
        }
        table tr:last-child td {
            border-bottom: none;
        }
        table tr:hover td {
            background: var(--gray-50);
        }
        table .clickable-row {
            cursor: pointer;
        }
        table .clickable-row:hover td {
            background: var(--gray-50);
        }

        /* ─── STATUS BADGES ─── */
        .status-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.2px;
        }
        .status-badge.active {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.inactive {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.completed {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-badge.on-hold {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .status-badge.review {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.approved {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.rejected {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.open {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.resolved {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.in-progress {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.scheduled {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.new {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .status-badge.shortlisted {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.interviewed {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-badge.offered {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.high {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.medium {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.low {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.draft {
            background: #f1f5f9;
            color: #475569;
        }
        .status-badge.previewed {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge['pending-approval'] {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.generated {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-badge.sent {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.viewed {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.accepted {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.expired {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.withdrawn {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .status-badge.cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* ─── AVATARS ─── */
        .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-light);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            margin-right: 8px;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .avatar-sm.green {
            background: var(--success);
        }
        .avatar-sm.orange {
            background: var(--warning);
        }
        .avatar-sm.purple {
            background: #8b5cf6;
        }
        .avatar-sm.red {
            background: var(--danger);
        }
        .avatar-sm.blue {
            background: var(--secondary);
        }
        .avatar-sm.gray {
            background: var(--gray-400);
        }
        .avatar-sm.sm {
            width: 28px;
            height: 28px;
            font-size: 10px;
        }

        .cell-flex {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .text-muted {
            color: var(--gray-500);
            font-size: 13px;
        }
        .text-sm {
            font-size: 12.5px;
        }
        .text-xs {
            font-size: 11px;
        }
        .fw-600 {
            font-weight: 600;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--gray-100);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 7px 18px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 12.5px;
            cursor: pointer;
            color: var(--gray-600);
            transition: all var(--transition);
            font-family: var(--font);
        }
        .tab:hover {
            color: var(--gray-900);
        }
        .tab.active {
            background: #fff;
            color: var(--gray-900);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: 18px;
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.3);

                const data = JSON.parse(raw);
                const def = defaultDB();

                return data;
            } catch (_) { return defaultDB(); }

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { info: 'fa-circle-info', success: 'fa-check-circle', error: 'fa-exclamation-circle',
                warning: 'fa-triangle-exclamation' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML =
                `<i class="fas ${icons[type] || icons.info}"></i><span>${msg}</span><button class="toast-close"><i class="fas fa-xmark"></i></button>`;
            el.querySelector('.toast-close').addEventListener('click', () => el.remove());
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
        }

                html += `<div class="nav-section">${sec.group}</div>`;
                for (const item of sec.items) {
                    const active = item.id === currentPage ? 'active' : '';
                    const count = getCount(item.id);
                    const badge = count > 0 ? `<span class="badge">${count}</span>` : '';
                    html +=
                        `<div class="nav-item ${active}" data-page="${item.id}"><i class="fas ${item.icon}"></i> ${item.label} ${badge}</div>`;
                }
            }
            nav.innerHTML = html;
            nav.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.page;
                    if (id) navigateTo(id);
                });
            });
            if (currentUser) {
                document.getElementById('sidebarAvatar').textContent = currentUser.avatar || currentUser.name[0];

                const roleMap = { admin: 'Administrator', hr: 'HR Manager', employee: 'Employee' };
                document.getElementById('sidebarRole').textContent = roleMap[currentUser.role] || 'Employee';
            }

        function renderJobProfiles(container) {
            ensureOfferDB();
            const isAdmin = currentUser.role === 'admin' || currentUser.role === 'hr';
            const profiles = db.jobProfiles || [];

            container.innerHTML = `
            <div class="section-header">
              <h2><i class="fas fa-briefcase"></i> Job Profile Master</h2>
              ${isAdmin ? `<button class="btn btn-primary" onclick="openAddJobProfile()"><i class="fas fa-plus"></i> Add Profile</button>` : ''}
            </div>
            <div class="ai-insight"><i class="fas fa-database"></i><div class="content">
              <div class="title">PROFILE MASTER — BACKEND CONTROLLED</div>
              <div class="message">Each profile contains salary rules, responsibilities, policies, and clauses. HR only selects the profile — the system loads everything.</div>
            </div><span class="badge-ai">${profiles.length} PROFILES</span></div>
            <div class="table-wrap"><div class="table-scroll">
              <table>
                <thead><tr><th>Profile</th><th>Department</th><th>Designation</th><th>Full-Time Salary</th><th>Intern Salary</th><th>Status</th>${isAdmin ? '<th>Actions</th>' : ''}</tr></thead>
                <tbody>
                  ${profiles.map(p => `
                    <tr>
                      <td><strong>${p.name}</strong></td>
                      <td>${p.department}</td>
                      <td>${p.designation}</td>
                      <td><span style="font-weight:600;color:var(--primary)">₹${p.defaultFullTimeSalary?.toLocaleString() || '—'}</span></td>
                      <td><span style="font-weight:600;color:var(--secondary)">₹${p.defaultInternSalary?.toLocaleString() || '—'}</span></td>
                      <td><span class="status-badge ${p.status}">${p.status}</span></td>
                      ${isAdmin ? `<td>
                        <button class="btn btn-sm btn-primary" onclick="openEditJobProfile(${p.id})"><i class="fas fa-pen"></i></button>
                        <button class="btn btn-sm btn-outline" onclick="viewJobProfile(${p.id})"><i class="fas fa-eye"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteJobProfile(${p.id})"><i class="fas fa-trash"></i></button>
                      </td>` : ''}
                    </tr>
                  `).join('') || '<tr><td colspan="7" class="text-muted text-center">No job profiles configured. Add your first profile.</td></tr>'}
                </tbody>
              </table>
            </div></div>`;

        function saveJobProfile(event, id) {
            event.preventDefault();
            const name = document.getElementById('jpName').value.trim();
            const department = document.getElementById('jpDept').value;
            const designation = document.getElementById('jpDesignation').value.trim();
            const category = document.getElementById('jpCat').value;
            const fullSalary = parseFloat(document.getElementById('jpFullSalary').value) || 20000;
            const internSalary = parseFloat(document.getElementById('jpInternSalary').value) || 10000;
            const reportingTo = document.getElementById('jpReporting').value.trim() || 'Manager';
            const summary = document.getElementById('jpSummary').value.trim();
            const respText = document.getElementById('jpResponsibilities').value;
            const responsibilities = respText.split('\n').filter(s => s.trim().length > 0);
            const skillsText = document.getElementById('jpSkills').value;
            const requiredSkills = skillsText.split(',').map(s => s.trim()).filter(s => s.length > 0);
            const probation = document.getElementById('jpProbation').value.trim() || '3 months';
            const notice = document.getElementById('jpNotice').value.trim() || '30 days';
            const workingHours = document.getElementById('jpWorkingHours').value.trim() || '9:00 AM – 6:00 PM';
            const weeklyOff = document.getElementById('jpWeeklyOff').value.trim() || 'Saturday & Sunday';
            const leavePolicy = document.getElementById('jpLeavePolicy').value.trim() || 'Standard leave policy';
            const perfText = document.getElementById('jpPerformance').value;
            const performanceExpectations = perfText.split('\n').filter(s => s.trim().length > 0);
            const confidentiality = document.getElementById('jpConfidentiality').value.trim() ||
                'You shall maintain strict confidentiality of all company information.';
            const termination = document.getElementById('jpTermination').value.trim() ||
                'Either party may terminate with 30 days notice.';

            if (!name || !designation) return toast('Name and designation required.', 'warning');

            const profile = {
                name,
                department,
                category,
                designation,
                defaultFullTimeSalary: fullSalary,
                defaultInternSalary: internSalary,
                reportingTo,
                status: 'active',
                jobSummary: summary || '—',
                responsibilities: responsibilities.length ? responsibilities : ['—'],
                requiredSkills: requiredSkills.length ? requiredSkills : ['—'],
                probationPeriod: probation,
                noticePeriod: notice,
                workingHours,
                weeklyOff,
                leavePolicy,
                performanceExpectations: performanceExpectations.length ? performanceExpectations : ['—'],
                confidentialityClause: confidentiality,
                terminationClause: termination,
                ipClause: 'Any intellectual property created during employment shall be the property of the company.',
                companyPolicies: 'You shall adhere to all company policies, code of conduct, and applicable laws.'
            };

            if (id) {
                const idx = db.jobProfiles.findIndex(x => x.id === id);
                if (idx === -1) return toast('Not found', 'error');
                db.jobProfiles[idx] = { ...db.jobProfiles[idx], ...profile };
                toast('Profile updated!', 'success');
                logOfferAudit('Profile Updated', profile.name, null, 'Job Profile');
            } else {
                profile.id = genId('jobProfile');
                db.jobProfiles.push(profile);
                toast('Profile created!', 'success');
                logOfferAudit('Profile Created', profile.name, null, 'Job Profile');
            }
            saveDB();
            closeModal();
            renderApp();
        }

        function toggleIncentiveInput() {
            const val = document.getElementById('ofIncentive').value;
            document.getElementById('incentiveInputGroup').style.display = (val === 'Fixed' || val === 'Percentage') ?
                'block' : 'none';
        }

        function updateOfferSalary() {
            const profileId = parseInt(document.getElementById('ofProfile').value);
            const empType = document.getElementById('ofEmploymentType').value;
            const prof = db.jobProfiles.find(p => p.id === profileId);
            if (prof) {
                const salary = empType === 'Intern' ? prof.defaultInternSalary : prof.defaultFullTimeSalary;
                document.getElementById('ofAutoSalary').textContent = '₹' + (salary || 0).toLocaleString();
            } else {
                document.getElementById('ofAutoSalary').textContent = '₹0';
            }
        }

        function saveOffer(event) {
            event.preventDefault();
            ensureOfferDB();
            const name = document.getElementById('ofEmployeeName').value.trim();
            const interviewDate = document.getElementById('ofInterviewDate').value;
            const joiningDate = document.getElementById('ofJoiningDate').value;
            const profileId = parseInt(document.getElementById('ofProfile').value);
            const empType = document.getElementById('ofEmploymentType').value;
            const incentiveType = document.getElementById('ofIncentive').value;
            let incentiveValue = document.getElementById('ofIncentiveValue').value.trim();

            if (!name || !interviewDate || !joiningDate || !profileId) {
                return toast('Please fill all required fields.', 'warning');
            }

            const prof = db.jobProfiles.find(p => p.id === profileId);
            if (!prof) return toast('Profile not found.', 'error');

            const salary = empType === 'Intern' ? prof.defaultInternSalary : prof.defaultFullTimeSalary;
            let incentiveDisplay = 'No Incentive';
            if (incentiveType === 'Fixed' && incentiveValue) {
                incentiveDisplay = '₹' + parseFloat(incentiveValue).toLocaleString();
            } else if (incentiveType === 'Percentage' && incentiveValue) {
                incentiveDisplay = incentiveValue + '%';
            } else if (incentiveType === 'No Incentive') {
                incentiveDisplay = 'No Incentive';
            }

            // Generate offer ID
            const prefix = db.companySettings?.offerPrefix || 'OFF';
            const year = new Date().getFullYear();
            const count = (db.offerLetters || []).length + 1;
            const offerId = prefix + '-' + year + '-' + String(count).padStart(6, '0');

            const offer = {
                id: genId('offerLetter'),
                offerId: offerId,
                employeeName: name,
                interviewedDate: interviewDate,
                joiningDate: joiningDate,
                profileId: profileId,
                employmentType: empType,
                incentive: incentiveDisplay,
                incentiveRaw: incentiveType === 'Fixed' ? parseFloat(incentiveValue) || 0 :
                    incentiveType === 'Percentage' ? parseFloat(incentiveValue) || 0 : 0,
                incentiveType: incentiveType,
                salary: salary,
                status: 'previewed',
                offerDate: todayStr(),
                offerExpiry: new Date(new Date().getTime() + (db.companySettings?.offerExpiryDays || 7) * 24 * 60 * 60 *
                    1000).toISOString().slice(0, 10),
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                approvedBy: '',
                approvedAt: '',
                pdfPath: '',
                auditLog: [{
                    timestamp: new Date().toISOString(),
                    action: 'Offer Created',
                    user: currentUser?.name || 'System'
                }]
            };

            db.offerLetters.push(offer);
            logOfferAudit('Offer Created', name, offer.offerId, 'Offer');
            saveDB();
            closeModal();
            toast('Offer preview generated!', 'success');
            // Navigate to offer list
            navigateTo('offerLetters');
            // Auto-open preview
            setTimeout(() => openPreviewOffer(offer.id), 300);
        }

            } else if (offer.incentiveType === 'Percentage' && offer.incentiveRaw) {
                incentiveDisplay = offer.incentiveRaw + '%';

            return `
            <div class="offer-preview">
              <div class="header">
                <div class="logo"><i class="fas fa-cubes"></i> ${company.companyName || 'HR+ Solutions'}</div>

        // ─── OFFER ACTIONS ──────────────────────────────────────────────

        function approveOffer(id) {
            const offer = db.offerLetters.find(o => o.id === id);
            if (!offer) return toast('Not found', 'error');
            if (offer.status === 'approved' || offer.status === 'generated') {
                return toast('Offer already approved.', 'info');
            }
            offer.status = 'approved';
            offer.approvedBy = currentUser?.name || 'Admin';
            offer.approvedAt = new Date().toISOString();
            offer.updatedAt = new Date().toISOString();
            offer.auditLog.push({ timestamp: new Date().toISOString(), action: 'Offer Approved', user: currentUser
                    ?.name || 'Admin' });
            saveDB();
            toast('Offer approved!', 'success');
            logOfferAudit('Offer Approved', offer.employeeName, offer.offerId, 'Offer');
            renderApp();
            closeModal();
        }

        function generateOfferPDF(id) {
            const offer = db.offerLetters.find(o => o.id === id);
            if (!offer) return toast('Not found', 'error');
            offer.status = 'generated';
            offer.updatedAt = new Date().toISOString();
            offer.pdfPath = '/pdf/' + offer.offerId + '.pdf';
            offer.auditLog.push({ timestamp: new Date().toISOString(), action: 'PDF Generated', user: currentUser
                    ?.name || 'System' });
            saveDB();
            toast('PDF generated: ' + offer.offerId + '.pdf', 'success');
            logOfferAudit('PDF Generated', offer.employeeName, offer.offerId, 'Offer');
            renderApp();
            // Show preview with PDF notice
            openPreviewOffer(id);
        }

        function sendOffer(id) {
            const offer = db.offerLetters.find(o => o.id === id);
            if (!offer) return toast('Not found', 'error');
            if (offer.status !== 'approved' && offer.status !== 'generated') {
                return toast('Please approve and generate PDF first.', 'warning');
            }
            offer.status = 'sent';
            offer.updatedAt = new Date().toISOString();
            offer.auditLog.push({ timestamp: new Date().toISOString(), action: 'Offer Sent', user: currentUser
                    ?.name || 'System' });
            saveDB();
            toast('Offer sent to ' + offer.employeeName + '!', 'success');
            logOfferAudit('Offer Sent', offer.employeeName, offer.offerId, 'Offer');
            renderApp();
        }

        function deleteOffer(id) {
            if (!confirm('Delete this offer letter?')) return;
            const offer = db.offerLetters.find(o => o.id === id);
            db.offerLetters = db.offerLetters.filter(o => o.id !== id);
            if (offer) logOfferAudit('Offer Deleted', offer.employeeName, offer.offerId, 'Offer');
            saveDB();
            toast('Offer deleted.', 'info');
            renderApp();
        }

            ensureOfferDB();
            db.offerAuditLogs.unshift({

                timestamp: new Date().toISOString(),
                user: currentUser?.name || 'System',
                action,
                entity,
                reference,
                module
            });
            if (db.offerAuditLogs.length > 200) db.offerAuditLogs = db.offerAuditLogs.slice(0, 200);
            saveDB();
        }

        function saveEmployeeFull(event, id) {
            event.preventDefault();
            const name = document.getElementById('efName').value.trim();
            const email = document.getElementById('efEmail').value.trim();
            const dept = document.getElementById('efDept').value;
            const pos = document.getElementById('efPos').value.trim();
            const designation = document.getElementById('efDesignation').value.trim() || pos;
            const role = document.getElementById('efRole').value;
            const status = document.getElementById('efStatus').value;
            const joined = document.getElementById('efJoined').value || todayStr();
            const mobile = document.getElementById('efMobile').value.trim();
            const dob = document.getElementById('efDob').value;
            const gender = document.getElementById('efGender').value;
            const bloodGroup = document.getElementById('efBlood').value;
            const salary = parseFloat(document.getElementById('efSalary').value) || 50000;
            const ctc = parseFloat(document.getElementById('efCtc').value) || 65000;
            const reportingManager = document.getElementById('efManager').value.trim() || 'Admin User';
            const probation = parseInt(document.getElementById('efProbation').value) || 90;

            const emergencyContact = document.getElementById('efEmerName')?.value.trim() || '';
            const emergencyPhone = document.getElementById('efEmerPhone')?.value.trim() || '';
            const emergencyRelation = document.getElementById('efEmerRel')?.value || '';
            const familyPhone = document.getElementById('efFamilyPhone')?.value.trim() || '';

            const currentAddress = document.getElementById('efCurrentAddr')?.value.trim() || '';
            const city = document.getElementById('efCity')?.value.trim() || '';
            const state = document.getElementById('efState')?.value.trim() || '';
            const pin = document.getElementById('efPin')?.value.trim() || '';
            const accommodationType = document.getElementById('efAccomType')?.value || 'Own';
            const pgAddress = document.getElementById('efPgAddr')?.value.trim() || '';
            const pgContact = document.getElementById('efPgContact')?.value.trim() || '';
            const pgPhone = document.getElementById('efPgPhone')?.value.trim() || '';
            const homeAddress = document.getElementById('efHomeAddr')?.value.trim() || '';

            if (!name || !email || !pos) return toast('Name, email and position required.', 'warning');
            if (!emergencyContact || !emergencyPhone) return toast('Emergency contact name and number are required.',
                'warning');
            if (!currentAddress) return toast('Current address is required.', 'warning');

            const basic = Math.round(salary * 0.4);
            const hra = Math.round(salary * 0.2);
            const conveyance = Math.round(salary * 0.1);

        // ─── ATTENDANCE ─────────────────────────────────────────────────

        function calcTimeDiffMinutes(start, end) {
            if (!start || !end) return 0;
            const s = new Date(`1970-01-01T${start}:00`);
            let e = new Date(`1970-01-01T${end}:00`);
            if (e < s) e = new Date(e.getTime() + 24 * 60 * 60 * 1000);
            return Math.round((e - s) / 60000);
        }

        function calcAttendanceMetrics(checkIn, checkOut, shiftName = 'Morning') {
            const shift = (db.shifts || []).find(s => s.name === shiftName) || { startTime: '09:00', endTime: '18:00',
                gracePeriod: 15, breakDuration: 60 };
            const grace = parseInt(shift.gracePeriod) || 15;
            const breakMin = parseInt(shift.breakDuration) || 60;
            const shiftStart = shift.startTime || '09:00';
            const shiftEnd = shift.endTime || '18:00';

            let lateMinutes = 0;
            if (checkIn && checkIn > shiftStart) {
                lateMinutes = Math.max(0, calcTimeDiffMinutes(shiftStart, checkIn) - grace);
            }
            let earlyExit = 0;
            if (checkOut && checkOut < shiftEnd) {
                earlyExit = calcTimeDiffMinutes(checkOut, shiftEnd);
            }
            const grossMin = calcTimeDiffMinutes(checkIn, checkOut);
            const netMin = Math.max(0, grossMin - breakMin);
            const totalHours = +(netMin / 60).toFixed(2);
            const expectedMin = calcTimeDiffMinutes(shiftStart, shiftEnd) - breakMin;
            const otMin = Math.max(0, netMin - expectedMin);
            const overtimeHours = +(otMin / 60).toFixed(2);
            const shortHours = Math.max(0, expectedMin - netMin);
            let status = 'present';
            if (!checkIn && !checkOut) status = 'absent';
            else if (totalHours < 4) status = 'half-day';
            else if (lateMinutes > 0 && totalHours >= 4) status = 'late';
            return { lateMinutes, earlyExit, totalHours, overtimeHours, shortHours: +(shortHours / 60).toFixed(2), status,
                breakMin };
        }

        function saveAttendanceFull(event, empId) {
            event.preventDefault();
            const eid = empId || parseInt(document.getElementById('attEmp').value);
            const date = document.getElementById('attDate')?.value || todayStr();
            const checkIn = document.getElementById('attIn').value;
            const checkOut = document.getElementById('attOut').value;
            const shiftName = document.getElementById('attShift')?.value || 'Morning Shift';
            const breakMin = parseInt(document.getElementById('attBreak')?.value) || 60;
            const mode = document.getElementById('attMode')?.value || 'Office';
            const notes = document.getElementById('attNotes')?.value.trim() || '';

            const metrics = calcAttendanceMetrics(checkIn, checkOut, shiftName);
            metrics.breakMinutes = breakMin;
            const grossMin = calcTimeDiffMinutes(checkIn, checkOut);
            const netMin = Math.max(0, grossMin - breakMin);
            metrics.totalHours = +(netMin / 60).toFixed(2);

            const existing = db.attendance.find(a => a.employeeId === eid && a.date === date);
            const record = {
                employeeId: eid,
                date,
                checkIn: checkIn || '00:00',
                checkOut: checkOut || '00:00',
                totalHours: metrics.totalHours,
                status: metrics.status === 'late' ? 'present' : metrics.status,
                lateMinutes: metrics.lateMinutes,
                overtimeHours: metrics.overtimeHours,
                shortHours: metrics.shortHours,
                earlyExitMinutes: metrics.earlyExit,
                breakMinutes: breakMin,
                shift: shiftName,
                workMode: mode,
                notes
            };
            if (metrics.lateMinutes > 0 && metrics.totalHours >= 4) record.status = 'late';
            if (metrics.totalHours > 0 && metrics.totalHours < 4) record.status = 'half-day';
            if (!checkIn || checkIn === '00:00') record.status = 'absent';

            if (existing) {
                Object.assign(existing, record);
                toast(`Attendance updated · ${metrics.totalHours}h · Late ${metrics.lateMinutes}m · OT ${metrics.overtimeHours}h`, 'success');
            } else {
                db.attendance.push({ id: genId('attendance'), ...record });
                toast(`Attendance saved · ${metrics.totalHours}h · Late ${metrics.lateMinutes}m · OT ${metrics.overtimeHours}h`, 'success');
            }
            if (metrics.lateMinutes > 15 && typeof fireEvent === 'function') {
                fireEvent('LateArrival', { lateMinutes: metrics.lateMinutes, employeeId: eid, message: `Late by ${metrics.lateMinutes} minutes` });
            }
            saveDB();
            closeModal();
            renderApp();
        }

            const department = document.getElementById('reqDept').value;
            const vacancies = parseInt(document.getElementById('reqVac').value) || 1;
            const hiringManager = document.getElementById('reqManager').value.trim() || 'Admin';

            const priority = document.getElementById('reqPriority').value;
            const empType = document.getElementById('reqEmpType').value;
            const workMode = document.getElementById('reqWorkMode').value;
            const skills = document.getElementById('reqSkills').value.trim();
            const deadline = document.getElementById('reqDeadline').value;
            const status = document.getElementById('reqStatus')?.value || 'open';
            if (!position) return toast('Position required.', 'warning');

            if (id) {
                const idx = db.requisitions.findIndex(r => r.id === id);

        function updateOnboarding(id) {
            const o = db.onboarding.find(item => item.id === id);
            if (!o) return toast('Not found', 'error');
            const tasks = ['documents', 'kyc', 'bankDetails', 'emailCreated', 'erpAccount', 'laptopAssigned', 'idCard',
                'accessCard', 'trainingAssigned', 'orientation', 'policyAcceptance', 'ndaSigned', 'bgv'
            ];
            const statuses = tasks.map(t => {
                const val = o[t];
                if (typeof val === 'boolean') return val ? '✅' : '⬜';
                return val === 'Completed' ? '✅' : '⬜';
            });
            const completed = statuses.filter(s => s === '✅').length;
            const total = tasks.length;
            const pct = Math.round((completed / total) * 100);
            showModal(`
            <div class="modal-header"><h3><i class="fas fa-rocket"></i> Onboarding Progress</h3><button class="close" onclick="closeModal()">&times;</button></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
              ${tasks.map((t, i) => `
                <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--gray-50);border-radius:6px;font-size:12.5px;">
                  <span style="font-size:16px;">${statuses[i]}</span>
                  <span>${t.replace(/([A-Z])/g,' $1').trim()}</span>
                  <button class="btn btn-xs btn-primary" onclick="toggleOnboardingTask(${id},'${t}')">Toggle</button>
                </div>
              `).join('')}
            </div>
            <div style="text-align:center;padding:12px;background:var(--gray-50);border-radius:8px;">
              <strong>Completion: ${pct}%</strong>
              <div style="background:var(--gray-200);border-radius:10px;height:6px;margin-top:6px;overflow:hidden;">
                <div style="width:${pct}%;height:100%;background:var(--primary);border-radius:10px;transition:width 0.4s ease;"></div>
              </div>
            </div>
            <div class="form-actions"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>
          `);
        }

        function toggleOnboardingTask(id, task) {
            const o = db.onboarding.find(item => item.id === id);
            if (!o) return;
            if (typeof o[task] === 'boolean') {
                o[task] = !o[task];
            } else {
                o[task] = o[task] === 'Completed' ? 'Pending' : 'Completed';
            }
            const tasks = ['documents', 'kyc', 'bankDetails', 'emailCreated', 'erpAccount', 'laptopAssigned', 'idCard',
                'accessCard', 'trainingAssigned', 'orientation', 'policyAcceptance', 'ndaSigned', 'bgv'
            ];
            const completed = tasks.filter(t => {
                const val = o[t];
                if (typeof val === 'boolean') return val;
                return val === 'Completed';
            }).length;
            o.completion = Math.round((completed / tasks.length) * 100);
            if (o.completion === 100) o.status = 'completed';
            else o.status = 'in-progress';
            saveDB();
            updateOnboarding(id);
            toast('Task toggled!', 'success');
        }

        function generateReport() {
            const type = document.getElementById('reportType').value;
            const from = document.getElementById('reportFrom').value;
            const to = document.getElementById('reportTo').value;
            const dept = document.getElementById('reportDept').value;
            let data = [];
            let headers = [];
            let title = '';

            switch (type) {
                case 'employee':
                    data = db.employees.filter(e => !dept || e.department === dept);
                    headers = ['ID', 'Name', 'Department', 'Position', 'Status', 'Salary', 'Joining'];
                    title = 'Employee Master Report';
                    break;
                case 'attendance':
                    data = db.attendance.filter(a => {
                        const d = a.date;
                        return (!from || d >= from) && (!to || d <= to);
                    }).map(a => ({ ...a, employeeName: getEmployeeName(a.employeeId) }));
                    headers = ['Employee', 'Date', 'Check In', 'Check Out', 'Hours', 'Status'];
                    title = 'Attendance Report';
                    break;
                case 'leave':
                    data = db.leaves.filter(l => {
                        const d = l.startDate;
                        return (!from || d >= from) && (!to || d <= to);
                    }).map(l => ({ ...l, employeeName: getEmployeeName(l.employeeId) }));
                    headers = ['Employee', 'Type', 'Start', 'End', 'Days', 'Status'];
                    title = 'Leave Report';
                    break;
                case 'performance':
                    data = db.performances.filter(p => {
                        const d = p.date;
                        return (!from || d >= from) && (!to || d <= to);
                    }).map(p => ({ ...p, employeeName: getEmployeeName(p.employeeId) }));
                    headers = ['Employee', 'Reviewer', 'Date', 'Rating', 'Comments'];
                    title = 'Performance Report';
                    break;
                case 'payroll':
                    data = db.employees.filter(e => !dept || e.department === dept);
                    headers = ['Name', 'Department', 'Salary', 'Net Pay', 'Status'];
                    title = 'Payroll Report';
                    break;
                case 'recruitment':
                    data = db.requisitions;
                    headers = ['Position', 'Department', 'Vacancies', 'Status', 'Priority'];
                    title = 'Recruitment Report';
                    break;
                case 'incentive':
                    data = db.incentives.map(i => ({ ...i, employeeName: getEmployeeName(i.employeeId) }));
                    headers = ['Employee', 'Plan', 'Achievement %', 'Amount', 'Status'];
                    title = 'Incentive Report';
                    break;
                case 'training':
                    data = db.trainings.map(t => ({ ...t, employeeName: getEmployeeName(t.employeeId) }));
                    headers = ['Employee', 'Training', 'Provider', 'Score', 'Status'];
                    title = 'Training Report';
                    break;
                case 'grievance':
                    data = db.grievances.map(g => ({ ...g, employeeName: getEmployeeName(g.employeeId) }));
                    headers = ['Employee', 'Category', 'Description', 'Priority', 'Status'];
                    title = 'Grievance Report';
                    break;
                case 'exit':
                    data = db.exitManagement.map(x => ({ ...x, employeeName: getEmployeeName(x.employeeId) }));
                    headers = ['Employee', 'Resignation Date', 'Last Day', 'Reason', 'Status'];
                    title = 'Exit Report';
                    break;
                case 'offers':
                    data = (db.offerLetters || []).map(o => {
                        const p = db.jobProfiles.find(j => j.id === o.profileId);
                        return { ...o, profileName: p ? p.name : '—' };
                    });
                    headers = ['Offer ID', 'Employee', 'Profile', 'Employment', 'Salary', 'Status'];
                    title = 'Offer Letters Report';
                    break;
                default:
                    data = [];
                    headers = [];
            }

            const table = document.getElementById('reportTable');
            let html = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            if (data.length === 0) {
                html += `<tr><td colspan="${headers.length || 1}" class="text-muted text-center">No records found.</td></tr>`;
            } else {
                for (const row of data) {
                    html += `<tr>${headers.map(h => {
                        const key = h.toLowerCase().replace(/ /g,'');
                        const val = row[key] ?? row[h] ?? '—';
                        return `<td>${val}</td>`;
                    }).join('')}</tr>`;
                }
            }
            html += '</tbody>';
            table.innerHTML = html;
            toast(`Report generated: ${title} (${data.length} records)`, 'success');
        }

        function exportReportCSV() {
            const table = document.getElementById('reportTable');
            let csv = '';
            const rows = table.querySelectorAll('tr');
            for (const row of rows) {
                const cols = row.querySelectorAll('th,td');
                const vals = Array.from(cols).map(c => c.textContent.trim());
                csv += vals.join(',') + '\n';
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `report_${todayStr()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            toast('CSV exported!', 'success');
        }

        function printReport() {
            const content = document.getElementById('reportOutput').innerHTML;
            const win = window.open('', '_blank');

            </head><body><h2>HR Report</h2>${content}</bod` + `y></htm` + `l>`);
            win.document.close();
            win.print();
            toast('Print dialog opened.', 'info');
        }

        //  ADVANCED TIME TRACKING ENGINE (existing functions)
        // ═══════════════════════════════════════════════════════════════════

        function ensureTimeDB() {
            if (!db.timeEvents) db.timeEvents = [];
            if (!db.breaks) db.breaks = [];
            if (!db.fieldSessions) db.fieldSessions = [];
            if (!db.travelSessions) db.travelSessions = [];
            if (!db.overtimeRequests) db.overtimeRequests = [];
            if (!db.geofences) db.geofences = [];
            if (!db.timeCorrections) db.timeCorrections = [];
            if (!db.timePolicies) db.timePolicies = { gracePeriod: 15, minHours: 4, halfDayThreshold: 4, lateThreshold: 15,
                lunchAllowance: 45, standardDailyHours: 9, weeklyHours: 45, otApprovalRequired: true, maxOtDaily: 4 };
        }

        function pushTimeEvent(employeeId, eventType, extra = {}) {
            ensureTimeDB();
            const now = new Date();
            const ts = now.toISOString().slice(0, 19).replace('T', ' ');
            const states = { CHECK_IN: 'WORKING', BREAK_START: 'BREAK', BREAK_END: 'WORKING', LUNCH_START: 'LUNCH',
                LUNCH_END: 'WORKING', FIELD_START: 'FIELD', FIELD_END: 'WORKING', TRAVEL_START: 'TRAVEL',
                TRAVEL_END: 'WORKING', CHECK_OUT: 'CHECKED_OUT', MEETING_START: 'MEETING', MEETING_END: 'WORKING' };
            db.timeEvents.unshift({
                id: genId('timeEvent'),
                employeeId,
                eventType,
                timestamp: ts,
                serverTimestamp: ts,
                location: extra.location || 'Office',
                lat: extra.lat || null,
                lng: extra.lng || null,
                source: extra.source || 'Web',
                device: extra.device || 'Browser',
                previousState: extra.previousState || 'UNKNOWN',
                newState: states[eventType] || eventType,
                verification: extra.verification || 'Manual',
                status: 'verified',
                notes: extra.notes || ''
            });
            saveDB();
        }

        function getLiveStatus(employeeId) {
            ensureTimeDB();
            const events = (db.timeEvents || []).filter(e => e.employeeId === employeeId).sort((a, b) => b.timestamp
                .localeCompare(a.timestamp));
            if (!events.length) return 'Not Started';
            const map = { WORKING: 'Working', BREAK: 'Break', LUNCH: 'Lunch', FIELD: 'Field Work', TRAVEL: 'Travel',
                MEETING: 'Meeting', CHECKED_OUT: 'Checked Out' };
            return map[events[0].newState] || events[0].newState || 'Unknown';
        }

            ensureTimeDB();

            container.innerHTML = `

            <div class="ai-insight"><i class="fas fa-history"></i><div class="content">

        function openLogTimeEvent() {
            const empOpts = db.employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
            const types = ['CHECK_IN', 'BREAK_START', 'BREAK_END', 'LUNCH_START', 'LUNCH_END', 'FIELD_START',

            showModal(`

            <form onsubmit="saveTimeEvent(event)">
              <div class="form-group"><label>Employee</label><select id="teEmp">${empOpts}</select></div>

                <div class="form-group"><label>Location</label><input type="text" id="teLoc" value="Office" /></div>

              </div>
              <div class="form-group"><label>Notes</label><input type="text" id="teNotes" /></div>
              <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Log Event</button></div>
            </form>`);
        }

        function saveTimeEvent(event) {
            event.preventDefault();
            const eid = parseInt(document.getElementById('teEmp').value);
            const type = document.getElementById('teType').value;
            pushTimeEvent(eid, type, {
                location: document.getElementById('teLoc').value,
                verification: document.getElementById('teVer').value,
                notes: document.getElementById('teNotes').value
            });
            if (type === 'CHECK_IN' || type === 'CHECK_OUT') {
                const today = todayStr();
                let rec = db.attendance.find(a => a.employeeId === eid && a.date === today);
                const nowTime = new Date().toTimeString().slice(0, 5);
                if (!rec) {
                    rec = { id: genId('attendance'), employeeId: eid, date: today, checkIn: type === 'CHECK_IN' ?
                            nowTime : '00:00', checkOut: type === 'CHECK_OUT' ? nowTime : '00:00', totalHours: 0,
                        status: 'present', lateMinutes: 0, overtimeHours: 0, shift: 'Morning' };
                    db.attendance.push(rec);
                } else {
                    if (type === 'CHECK_IN') rec.checkIn = nowTime;
                    if (type === 'CHECK_OUT') {
                        rec.checkOut = nowTime;
                        if (typeof calcAttendanceMetrics === 'function') {
                            const m = calcAttendanceMetrics(rec.checkIn, rec.checkOut);
                            rec.totalHours = m.totalHours;
                            rec.lateMinutes = m.lateMinutes;
                            rec.overtimeHours = m.overtimeHours;
                        }
                    }
                }
                saveDB();
            }
            toast('Time event logged: ' + type, 'success');
            closeModal();
            renderApp();
        }

                byEmp[a.employeeId].hours += a.totalHours || 0;
                byEmp[a.employeeId].ot += a.overtimeHours || 0;
                byEmp[a.employeeId].late += a.lateMinutes || 0;
                if (a.status === 'present' || a.status === 'late') byEmp[a.employeeId].present++;

                  <div class="form-group"><label>GPS Required</label><select id="polGps"><option value="true" ${p.gpsRequired!==false?'selected':''}>Yes</option><option value="false">No</option></select></div>
                  <div class="form-group"><label>Photo Required (Field)</label><select id="polPhoto"><option value="true" ${p.photoRequiredField?'selected':''}>Yes</option><option value="false">No</option></select></div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Policies</button>
            </form>`;
        }

        function saveTimePolicies(event) {
            event.preventDefault();
            ensureTimeDB();
            db.timePolicies = {
                gracePeriod: parseInt(document.getElementById('polGrace').value) || 15,
                lateThreshold: parseInt(document.getElementById('polLate').value) || 15,
                halfDayThreshold: parseFloat(document.getElementById('polHalf').value) || 4,
                minHours: parseFloat(document.getElementById('polMin').value) || 4,
                standardDailyHours: parseFloat(document.getElementById('polDaily').value) || 9,
                weeklyHours: parseFloat(document.getElementById('polWeekly').value) || 45,
                lunchAllowance: parseInt(document.getElementById('polLunch').value) || 45,
                teaBreakAllowance: parseInt(document.getElementById('polTea').value) || 15,
                otApprovalRequired: document.getElementById('polOtAppr').value === 'true',
                maxOtDaily: parseFloat(document.getElementById('polMaxOt').value) || 4,
                gpsRequired: document.getElementById('polGps').value === 'true',
                photoRequiredField: document.getElementById('polPhoto').value === 'true'
            };
            saveDB();
            toast('Time policies saved', 'success');
        }

        // ─── AUTOMATION ENGINE ───────────────────────────────────────────
        if (!db.automationRules) {
            db.automationRules = [
                { id: 1, name: 'New Employee Onboarding', module: 'Employee', event: 'EmployeeJoined',
                    condition: 'always', operator: 'eq', value: '', action: 'CreateOnboardingChecklist',
                    priority: 1, status: 'active', executionCount: 0 },
                { id: 2, name: 'Late Arrival Alert', module: 'Attendance', event: 'LateArrival',
                    condition: 'lateMinutes', operator: 'gt', value: '15', action: 'NotifyManager', priority: 2,
                    status: 'active', executionCount: 0 },
                { id: 3, name: 'Probation Ending', module: 'Employee', event: 'ProbationEnding',
                    condition: 'daysRemaining', operator: 'lt', value: '15', action: 'CreateReviewTask',
                    priority: 1, status: 'active', executionCount: 0 },
            ];
        }
        if (!db.automationLogs) db.automationLogs = [];
        if (!db.exceptions) db.exceptions = [];
        if (!db.auditLogs) db.auditLogs = [];

        function fireEvent(eventName, payload = {}) {
            (db.automationRules || []).filter(r => r.status === 'active' && r.event === eventName).forEach(rule => {
                let matched = rule.condition === 'always';
                if (!matched && payload[rule.condition] !== undefined) {
                    const v = payload[rule.condition],
                        t = parseFloat(rule.value);
                    if (rule.operator === 'gt') matched = v > t;
                    else if (rule.operator === 'lt') matched = v < t;
                    else if (rule.operator === 'gte') matched = v >= t;
                    else matched = v == rule.value;
                }
                if (matched) {
                    rule.executionCount = (rule.executionCount || 0) + 1;
                    db.automationLogs.unshift({ id: Date.now(), time: new Date().toISOString().slice(0, 16).replace('T',
                            ' '), automation: rule.name, trigger: eventName, result: rule.action,
                        status: 'success' });
                    toast('Automation: ' + rule.name, 'info');
                }
            });
            saveDB();
        }

        function logAudit(action, entity, before, after, module) {
            db.auditLogs.unshift({ id: Date.now(), timestamp: new Date().toISOString().slice(0, 19).replace('T', ' '),
                user: currentUser?.name || 'System', action, entity, before, after, module });
            if (db.auditLogs.length > 100) db.auditLogs = db.auditLogs.slice(0, 100);
            saveDB();
        }

        function generateEmployeeCode(dept) {
            return 'EPAY-HQ-' + (dept || 'GEN').substring(0, 2).toUpperCase() + '-' + String(db.nextId?.employee || db
                .employees.length + 1).padStart(5, '0');
        }

        // ─── APP INIT ───────────────────────────────────────────────────

        document.getElementById('logoutBtn').addEventListener('click', () => {
            toast('Admin session active.', 'info');
        });

        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const rows = document.querySelectorAll('#pageContent table tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = !q || text.includes(q) ? '' : 'none';
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault();
                document.getElementById('globalSearch').focus(); }
        });

        document.getElementById('hamburgerBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const hamburger = document.getElementById('hamburgerBtn');
            if (window.innerWidth <= 768 && sidebar.classList.contains('open') &&
                !sidebar.contains(e.target) && !hamburger.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });

        function renderApp() {
            renderSidebar();
            navigateTo(currentPage);
        }

        // ─── GLOBAL EXPOSURE ────────────────────────────────────────────

        window.navigateTo = navigateTo;

        window.openCreateOffer = openCreateOffer;

        // Init
        try {
            ensureOfferDB();
            renderApp();
        } catch (err) {
            console.error('App init error:', err);
            const container = document.getElementById('pageContent');
            if (container) container.innerHTML =
                `<div style="padding:24px;color:#b91c1c;"><h3>Initialization Error</h3><pre>${(err && err.stack) ? err.stack.replace(/</g,'&lt;') : String(err).replace(/</g,'&lt;')}</pre></div>`;
        }

        console.log('🚀 HR+ ERP System loaded with 40+ modules including Offer Letter Builder.');
        console.log(`📊 ${db.employees.length} employees, ${(db.jobProfiles||[]).length} profiles, ${(db.offerLetters||[]).length} offers.`);
