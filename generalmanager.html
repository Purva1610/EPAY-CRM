<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GM · General Manager Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js">
    </script>
    <style>



        /* ─── CSS VARIABLES ─── */
        :root {
            --primary: #0b8f6c;
            --primary-dark: #067a5a;
            --primary-light: #34d399;
            --primary-glow: rgba(11, 143, 108, 0.25);
            --secondary: #0ea5e9;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --sidebar-width: 264px;
            --header-height: 68px;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.10);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--gray-100);
            color: var(--gray-800);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        /* ─── SIDEBAR ─── */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--gray-900);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: transform var(--transition);
            overflow-y: auto;
            padding: 0 0 16px 0;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
        }
        #sidebar .brand {
            padding: 20px 24px 16px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #sidebar .brand i {
            color: var(--primary-light);
            font-size: 28px;
        }
        #sidebar .brand span {
            color: #fff;
        }
        #sidebar .brand small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.4;
            margin-left: auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .nav-section {
            padding: 18px 24px 6px 24px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.35;
            font-weight: 600;
            color: #a0aec0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 9px 20px;
            margin: 1px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            color: #94a3b8;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            position: relative;
            user-select: none;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .nav-item.active {
            background: rgba(16, 185, 129, 0.18);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.15);
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12%;
            height: 76%;
            width: 3px;
            background: var(--primary-light);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .nav-item .badge {
            margin-left: auto;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            padding: 1px 9px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .nav-item .badge.green {
            background: var(--success);
        }
        .nav-item .badge.warning {
            background: var(--warning);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .sidebar-footer .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(11, 143, 108, 0.3);
        }
        .sidebar-footer .info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-footer .info .name {
            color: #fff;
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .info .role {
            font-size: 11px;
            opacity: 0.45;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .logout-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 17px;
            transition: var(--transition);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-footer .logout-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        /* ─── MAIN ─── */
        #main {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--gray-50);
        }

        /* ─── HEADER ─── */
        #header {
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        #header .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--gray-700);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        #header .hamburger:hover {
            background: var(--gray-100);
        }
        #header .page-title {
            font-size: 19px;
            font-weight: 600;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-900);
        }
        #header .page-title small {
            font-weight: 400;
            color: var(--gray-500);
            font-size: 13px;
            margin-left: 4px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .search-box {
            display: flex;
            align-items: center;
            background: var(--gray-100);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            gap: 8px;
            border: 1px solid transparent;
            transition: all var(--transition);
        }
        .header-actions .search-box:focus-within {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .header-actions .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            padding: 6px 0;
            width: 160px;
            color: var(--gray-700);
            font-family: var(--font);
        }
        .header-actions .search-box input::placeholder {
            color: var(--gray-400);
        }
        .header-actions .search-box i {
            color: var(--gray-400);
            font-size: 14px;
        }
        .header-actions .notif {
            position: relative;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--gray-600);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .header-actions .notif:hover {
            background: var(--gray-100);
        }
        .header-actions .notif .dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 9px;
            height: 9px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid #fff;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* ─── PAGE CONTENT ─── */
        #pageContent {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 40px;
        }

        /* ─── STATS GRID ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: var(--transition);
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .stat-card .label {
            font-size: 11.5px;
            color: var(--gray-500);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-card .label i {
            font-size: 13px;
            opacity: 0.7;
        }
        .stat-card .value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .stat-card .change {
            font-size: 10.5px;
            font-weight: 500;
            margin-top: 4px;
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            background: var(--gray-100);
        }
        .stat-card .change.up {
            color: var(--success);
            background: #dcfce7;
        }
        .stat-card .change.down {
            color: var(--danger);
            background: #fee2e2;
        }
        .stat-card .change.neutral {
            color: var(--gray-500);
            background: var(--gray-100);
        }

        /* ─── SECTION HEADER ─── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-800);
        }
        .section-header h2 i {
            color: var(--primary);
        }
        .section-header h2 .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--gray-500);
            margin-left: 4px;
        }

        /* ─── BUTTONS ─── */
        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
            background: var(--gray-200);
            color: var(--gray-700);
            font-family: var(--font);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-warning:hover {
            background: #ca8a04;
        }
        .btn-sm {
            padding: 3px 12px;
            font-size: 10.5px;
            border-radius: 5px;
        }
        .btn-xs {
            padding: 2px 8px;
            font-size: 9.5px;
            border-radius: 4px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-600);
        }
        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }
        .btn-ghost {
            background: transparent;
            color: var(--gray-600);
        }
        .btn-ghost:hover {
            background: var(--gray-100);
        }

        /* ─── TABLE ─── */
        .table-wrap {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .table-scroll {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: var(--gray-50);
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        table td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
            color: var(--gray-700);
        }
        table tr:last-child td {
            border-bottom: none;
        }
        table tr:hover td {
            background: var(--gray-50);
        }

        /* ─── STATUS BADGES ─── */
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.2px;
        }
        .status-badge.active {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.inactive {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.completed {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-badge.on-hold {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .status-badge.review {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.approved {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.rejected {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.open {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.resolved {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.in-progress {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.scheduled {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.high {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.medium {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.low {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.critical {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.warning {
            background: #fef3c7;
            color: #b45309;
        }

        /* ─── AVATARS ─── */
        .avatar-sm {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary-light);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            margin-right: 6px;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .avatar-sm.green {
            background: var(--success);
        }
        .avatar-sm.orange {
            background: var(--warning);
        }
        .avatar-sm.purple {
            background: #8b5cf6;
        }
        .avatar-sm.red {
            background: var(--danger);
        }
        .avatar-sm.blue {
            background: var(--secondary);
        }
        .avatar-sm.gray {
            background: var(--gray-400);
        }

        .cell-flex {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .text-muted {
            color: var(--gray-500);
            font-size: 12px;
        }
        .text-sm {
            font-size: 12px;
        }
        .text-xs {
            font-size: 10.5px;
        }
        .fw-600 {
            font-weight: 600;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--gray-100);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            color: var(--gray-600);
            transition: all var(--transition);
            font-family: var(--font);
        }
        .tab:hover {
            color: var(--gray-900);
        }
        .tab.active {
            background: #fff;
            color: var(--gray-900);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: 18px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.3);
            animation: modalSlide 0.3s ease;
        }
        @keyframes modalSlide {
            from {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-200);
        }
        .modal .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-800);
        }
        .modal .modal-header h3 i {
            color: var(--primary);
        }
        .modal .modal-header .close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: var(--transition);
            line-height: 1;
        }
        .modal .modal-header .close:hover {
            color: var(--gray-700);
            background: var(--gray-100);
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-weight: 500;
            font-size: 12px;
            color: var(--gray-700);
            margin-bottom: 4px;
        }
        .modal .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }
        .modal .form-group input,
        .modal .form-group select,

            height: 6px;
            border-radius: 4px;
            background: var(--gray-200);

            font-size: 13px;

            height: 8px;

        .status-indicator .dot.blue {
            background: var(--secondary);

        .status-indicator .dot.gray {
            background: var(--gray-400);

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            width: 100%;

        .toast {
            background: var(--gray-900);
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);

            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: slideUp 0.35s ease;
            border-left: 4px solid var(--primary);
            backdrop-filter: blur(4px);

        .toast.success {
            border-left-color: var(--success);

        .toast.error {
            border-left-color: var(--danger);

        .toast.warning {
            border-left-color: var(--warning);

        .toast.info {

            to {

        function loadDB() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (!raw) return defaultDB();
                const data = JSON.parse(raw);
                const def = defaultDB();
                for (const k in def) { if (!data[k]) data[k] = def[k]; }
                if (!data.nextId) data.nextId = {};
                const idKeys = ['gallery', 'employee', 'sales', 'inventory', 'expense', 'pettyCash', 'complaint',
                    'approval', 'task', 'audit', 'membership', 'maintenance', 'transfer', 'vendor'
                ];
                for (const key of idKeys) {
                    if (!data.nextId[key]) data.nextId[key] = 1;
                }
                return data;
            } catch (_) { return defaultDB(); }
        }

        function formatDate(d) {
            if (!d) return '—';
            const dt = new Date(d);
            if (isNaN(dt)) return '—';
            return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateFull(d) {
            if (!d) return '—';
            const dt = new Date(d);
            if (isNaN(dt)) return '—';
            return dt.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        function todayStr() { return new Date().toISOString().slice(0, 10); }

        function nowISO() { return new Date().toISOString(); }

        function formatCurrency(amount) {
            if (amount >= 10000000) return '₹' + (amount / 10000000).toFixed(1) + 'Cr';
            if (amount >= 100000) return '₹' + (amount / 100000).toFixed(1) + 'L';
            if (amount >= 1000) return '₹' + (amount / 1000).toFixed(1) + 'K';
            return '₹' + amount.toLocaleString();
        }

        function formatCurrencyFull(amount) {
            return '₹' + amount.toLocaleString('en-IN');
        }

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { info: 'fa-circle-info', success: 'fa-check-circle', error: 'fa-exclamation-circle',
                warning: 'fa-triangle-exclamation' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML =
                `<i class="fas ${icons[type] || icons.info}"></i><span>${msg}</span><button class="toast-close"><i class="fas fa-xmark"></i></button>`;
            el.querySelector('.toast-close').addEventListener('click', () => el.remove());
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
        }

        function saveTransfer(event) {

            const sourceId = db.galleries[0].id;
            db.transfers.push({
                id: genId('transfer'),
                source: sourceId,
                destination: dest,
                product,
                quantity: qty,
                value: value,
                reason,

                receipt: null,
                variance: 0,

            event.preventDefault();
            const src = parseInt(document.getElementById('transferSrc').value);
            const dst = parseInt(document.getElementById('transferDst').value);
            const product = document.getElementById('transferProduct').value.trim();
            const qty = parseInt(document.getElementById('transferQty').value) || 0;
            const value = parseFloat(document.getElementById('transferValue').value) || 0;

        function generateGMReport() {
            const type = document.getElementById('reportType').value;
            const galleryId = document.getElementById('reportGallery').value;
            let data = [];
            let headers = [];
            let title = '';

            const gals = galleryId === 'all' ? db.galleries : db.galleries.filter(g => g.id === parseInt(galleryId));

            switch (type) {
                case 'daily':
                    data = gals.map(g => ({
                        name: g.name,
                        sales: db.sales.filter(s => s.galleryId === g.id && s.date === todayStr()).reduce((s, x) => s +
                            x.amount, 0),
                        target: db.sales.filter(s => s.galleryId === g.id && s.date === todayStr()).reduce((s, x) => s +
                            x.target, 0),
                        customers: g.customers,
                        employees: g.employees,
                        complaints: g.complaints,
                        health: g.health
                    }));
                    headers = ['Gallery', 'Sales', 'Target', 'Achievement', 'Customers', 'Employees', 'Complaints',
                        'Health'
                    ];
                    title = 'Daily Report';
                    break;
                case 'weekly':
                    data = gals.map(g => {
                        const weekSales = db.sales.filter(s => s.galleryId === g.id && new Date(s.date) > new Date(
                            Date.now() - 7 * 24 * 60 * 60 * 1000));
                        return { name: g.name, sales: weekSales.reduce((s, x) => s + x.amount, 0), target: weekSales
                                .reduce((s, x) => s + x.target, 0), customers: g.customers, health: g.health };
                    });
                    headers = ['Gallery', 'Weekly Sales', 'Weekly Target', 'Ach%', 'Customers', 'Health'];
                    title = 'Weekly Report';
                    break;
                case 'monthly':
                    data = gals.map(g => ({
                        name: g.name,
                        sales: g.sales,
                        target: g.target,
                        profit: g.profit,
                        customers: g.customers,
                        members: g.members,
                        health: g.health,
                        complaints: g.complaints
                    }));
                    headers = ['Gallery', 'Sales', 'Target', 'Ach%', 'Profit', 'Customers', 'Members', 'Health',
                        'Complaints'
                    ];
                    title = 'Monthly Business Review';
                    break;
                case 'gallery':
                    data = gals.map(g => ({
                        name: g.name,
                        manager: g.manager,
                        employees: g.employees,
                        sales: g.sales,
                        target: g.target,
                        health: g.health,
                        customers: g.customers,
                        members: g.members,
                        complaints: g.complaints,
                        inventory: g.inventory,
                        expenses: g.expenses
                    }));
                    headers = ['Gallery', 'Manager', 'Employees', 'Sales', 'Target', 'Ach%', 'Health', 'Customers',
                        'Members', 'Complaints', 'Inventory', 'Expenses'
                    ];
                    title = 'Gallery Performance Report';
                    break;
                case 'sales':
                    data = gals.map(g => ({
                        name: g.name,
                        sales: g.sales,
                        target: g.target,
                        customers: g.customers,
                        members: g.members,
                        orders: db.sales.filter(s => s.galleryId === g.id).reduce((s, x) => s + x.orders, 0),
                        discounts: db.sales.filter(s => s.galleryId === g.id).reduce((s, x) => s + x.discounts, 0)
                    }));
                    headers = ['Gallery', 'Sales', 'Target', 'Ach%', 'Customers', 'Members', 'Orders', 'Discounts'];
                    title = 'Sales Report';
                    break;
                case 'inventory':
                    data = gals.map(g => {
                        const items = db.inventoryItems.filter(i => i.galleryId === g.id);
                        return {
                            name: g.name,
                            totalStock: items.reduce((s, i) => s + i.stock, 0),
                            lowItems: items.filter(i => i.status === 'low').length,
                            slowItems: items.filter(i => i.status === 'slow').length,
                            goodItems: items.filter(i => i.status === 'good').length
                        };
                    });
                    headers = ['Gallery', 'Total Stock', 'Low Items', 'Slow Items', 'Good Items'];
                    title = 'Inventory Report';
                    break;
                case 'complaints':
                    data = gals.map(g => {
                        const comps = db.complaints.filter(c => c.galleryId === g.id);
                        return {
                            name: g.name,
                            total: comps.length,
                            resolved: comps.filter(c => c.status === 'resolved').length,
                            open: comps.filter(c => c.status === 'open' || c.status === 'in-progress').length,
                            critical: comps.filter(c => c.severity === 'critical').length,
                            high: comps.filter(c => c.severity === 'high').length
                        };
                    });
                    headers = ['Gallery', 'Total', 'Resolved', 'Open', 'Critical', 'High'];
                    title = 'Complaint Report';
                    break;
                default:
                    data = [];
                    headers = [];
            }

            const table = document.getElementById('reportTable');
            let html = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            if (data.length === 0) {
                html += `<tr><td colspan="${headers.length || 1}" class="text-muted text-center">No records found.</td></tr>`;
            } else {
                for (const row of data) {
                    const vals = Object.values(row);
                    html += `<tr>${vals.map(v => `<td>${typeof v === 'number' && v > 1000 ? formatCurrency(v) : v}</td>`).join('')}</tr>`;
                }
            }
            html += '</tbody>';
            table.innerHTML = html;
            toast(`Report generated: ${title} (${data.length} records)`, 'success');
        }

        function exportGMReportCSV() {
            const table = document.getElementById('reportTable');
            let csv = '';
            const rows = table.querySelectorAll('tr');
            for (const row of rows) {
                const cols = row.querySelectorAll('th,td');
                const vals = Array.from(cols).map(c => c.textContent.trim());
                csv += vals.join(',') + '\n';
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gm_report_${todayStr()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            toast('CSV exported!', 'success');
        }

        // ─── RENDER APP ──────────────────────────────────────────────────

        function renderApp() {
            renderSidebar();
            navigateTo(currentPage);
        }

        // ─── GLOBAL EXPOSURE ────────────────────────────────────────────

        window.navigateTo = navigateTo;
        window.closeModal = closeModal;
        window.toast = toast;
        window.renderApp = renderApp;
        window.getGallery = getGallery;
        window.getGalleryName = getGalleryName;
        window.formatDate = formatDate;
        window.formatDateFull = formatDateFull;
        window.todayStr = todayStr;
        window.formatCurrency = formatCurrency;
        window.formatCurrencyFull = formatCurrencyFull;

        // Expose all action functions
        window.viewGalleryDetail = viewGalleryDetail;
        window.initiateTransfer = initiateTransfer;
        window.saveTransfer = saveTransfer;
        window.saveTransferFull = saveTransferFull;
        window.approveTransfer = approveTransfer;
        window.receiveTransfer = receiveTransfer;
        window.promoteSlowItem = promoteSlowItem;
        window.openTransferModal = openTransferModal;
        window.openAddExpense = openAddExpense;
        window.saveExpenseFull = saveExpenseFull;
        window.approveExpense = approveExpense;
        window.completeTask = completeTask;
        window.unblockTask = unblockTask;
        window.resolveComplaint = resolveComplaint;
        window.viewComplaint = viewComplaint;
        window.approveApproval = approveApproval;
        window.rejectApproval = rejectApproval;
        window.generateGMReport = generateGMReport;
        window.exportGMReportCSV = exportGMReportCSV;

        // ─── INIT ─────────────────────────────────────────────────────────

        document.getElementById('logoutBtn').addEventListener('click', () => {
            toast('Session active.', 'info');
        });

        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const rows = document.querySelectorAll('#pageContent table tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = !q || text.includes(q) ? '' : 'none';
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault();
                document.getElementById('globalSearch').focus(); }
        });

        document.getElementById('hamburgerBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const hamburger = document.getElementById('hamburgerBtn');
            if (window.innerWidth <= 768 && sidebar.classList.contains('open') &&
                !sidebar.contains(e.target) && !hamburger.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });

        // Init
        try {
            renderApp();
            console.log('🚀 GM Dashboard v2.0 loaded');
            console.log(`📊 ${db.galleries.length} galleries, ${db.employees.length} employees, ${db.approvals.filter(a=>a.status==='pending').length} pending approvals`);
        } catch (err) {
            console.error('App init error:', err);
            const container = document.getElementById('pageContent');
            if (container) container.innerHTML =
                `<div style="padding:24px;color:#b91c1c;"><h3>Initialization Error</h3><pre>${(err && err.stack) ? err.stack.replace(/</g,'&lt;') : String(err).replace(/</g,'&lt;')}</pre></div>`;
        }
    </script>

    <style>

        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);

        text-align: center;

    }

    .crm-logout-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .crm-logout-btn:active {
        transform: translateY(0);
    }

    .crm-logout-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

    <!-- CRM Services -->
    <script src="session-timer-service.js"></script>
    <script src="email-service.js"></script>
    <script src="calling-service.js"></script>
    <script src="firebase-init.js"></script>

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
