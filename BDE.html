        .sidebar-link {
            transition: all 0.15s;

        .card-hover:hover {

        }
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0b0f19;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            color: #34d399;
            font-size: 18px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 640px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box input,
        .modal-box select,
        .modal-box textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-top: 6px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-box input:focus,
        .modal-box select:focus,
        .modal-box textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    AppData = JSON.parse(stored);
                    // Ensure arrays
                    if (!AppData.leads) AppData.leads = [];
                    if (!AppData.calls) AppData.calls = [];
                    if (!AppData.meetings) AppData.meetings = [];
                    if (!AppData.visits) AppData.visits = [];
                    if (!AppData.customers) AppData.customers = [];
                    if (!AppData.opportunities) AppData.opportunities = [];
                    if (!AppData.followups) AppData.followups = [];
                    if (!AppData.dailyReports) AppData.dailyReports = [];
                    if (!AppData.travelExpenses) AppData.travelExpenses = [];
                    if (!AppData.tasks) AppData.tasks = [];
                    if (!AppData.stats) AppData.stats = {};
                    if (!AppData.user) AppData.user = { name: 'Suresh', role: 'BDE', territory: 'North Zone' };
                    updateStats();
                    saveData();
                } else {
                    initDefaultData();
                    saveData();
                }
            } catch (e) {
                console.warn('Data load error, resetting', e);
                initDefaultData();
                saveData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(AppData));
            } catch (e) {}
        }

        function updateStats() {
            const leads = AppData.leads || [];
            const calls = AppData.calls || [];
            const meetings = AppData.meetings || [];
            const visits = AppData.visits || [];
            const customers = AppData.customers || [];
            const opportunities = AppData.opportunities || [];
            const followups = AppData.followups || [];
            const tasks = AppData.tasks || [];

            const totalLeads = leads.length;
            const newLeads = leads.filter(l => l.status === 'New').length;
            const contactsToday = calls.filter(c => c.date === new Date().toISOString().slice(0, 10)).length;
            const meetingsToday = meetings.filter(m => m.date === new Date().toISOString().slice(0, 10)).length;
            const visitsToday = visits.filter(v => v.date === new Date().toISOString().slice(0, 10)).length;
            const followupsDue = followups.filter(f => f.status === 'Pending').length;
            const followupsCompleted = followups.filter(f => f.status === 'Completed').length;
            const convertedLeads = leads.filter(l => l.status === 'Won').length;
            const lostLeads = leads.filter(l => l.status === 'Lost').length;
            const conversionRate = totalLeads ? Math.round((convertedLeads / totalLeads) * 100) : 0;
            const totalExpectedRevenue = leads.reduce((s, l) => s + (l.estimatedValue || 0), 0);
            const pendingTasks = tasks.filter(t => t.status === 'Pending').length;
            const totalRevenue = customers.reduce((s, c) => s + (c.revenue || 0), 0);
            const monthlyTarget = 100000; // sample
            const achievement = monthlyTarget ? Math.round((totalRevenue / monthlyTarget) * 100) : 0;

            AppData.stats = {
                monthlyTarget: monthlyTarget,
                businessGenerated: totalRevenue,
                achievement: achievement,
                targetGap: monthlyTarget - totalRevenue,
                totalLeads: totalLeads,
                newLeads: newLeads,
                contactsToday: contactsToday,
                meetingsToday: meetingsToday,
                visitsToday: visitsToday,
                followupsDue: followupsDue,
                followupsCompleted: followupsCompleted,
                convertedLeads: convertedLeads,
                lostLeads: lostLeads,
                conversionRate: conversionRate,
                expectedRevenue: totalExpectedRevenue,
                pendingTasks: pendingTasks,
                performanceScore: 85, // sample dynamic
            };
            saveData();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';
            menuStructure.forEach(group => {
                const div = document.createElement('div');
                const label = document.createElement('span');
                label.className = 'text-[10px] uppercase tracking-wider text-slate-500 font-semibold';
                label.textContent = group.section;
                div.appendChild(label);
                const ul = document.createElement('ul');
                ul.className = 'mt-2 space-y-1';
                group.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className =
                        `sidebar-link ${currentPage === item.id ? 'active' : ''}`;
                    li.dataset.page = item.id;
                    li.innerHTML = `<i class="${item.icon} w-4"></i>${item.label}`;
                    li.addEventListener('click', () => navigateTo(item.id));
                    ul.appendChild(li);
                });
                div.appendChild(ul);
                nav.appendChild(div);
            });
        }

            currentPage = pageId;
            renderSidebar();
            renderPage(pageId);

        function formatNum(n) {
            if (n >= 10000000) return (n / 10000000).toFixed(1) + 'Cr';
            if (n >= 100000) return (n / 100000).toFixed(1) + 'L';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
