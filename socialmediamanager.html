        .toast {

            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;

            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            color: #34d399;
            font-size: 18px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 540px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box input,
        .modal-box select,
        .modal-box textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-top: 6px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-box input:focus,
        .modal-box select:focus,
        .modal-box textarea:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129, 0.1);
        }
        .modal-box label {
            font-weight: 500;
            font-size: 13px;
            color: #334155;
            margin-top: 14px;
            display: block;
        }
        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .modal-box .form-row {
                grid-template-columns: 1fr;
            }
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;

            display: inline-block;
        }
        .status-badge.published {

        }
        .status-badge.scheduled {

        }
        .status-badge.draft {
            background: #f1f5f9;

        }
        .status-badge.active {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.paused {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #d97706;

            background: #dcfce7;

        .status-badge.converted {

        }
        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            transition: 0.15s;
        }
        .delete-btn:hover {
            color: #dc2626;
            transform: scale(1.1);
        }
        .edit-btn {
            color: #10b981;

            transition: 0.15s;
        }
        .edit-btn:hover {

        .platform-icon {
            width: 28px;

        .empty-state {

        /* fix for sidebar visibility */
        .sidebar-link {
            display: flex !important;
            align-items: center !important;

        #sidebarNav {
            display: block !important;
        }
        #sidebarNav ul {
            display: block !important;
        }
        #sidebarNav li {
            display: flex !important;
        }
    </style>
</head>

                </div>

        <!-- SCROLLABLE MAIN CONTENT -->

    <!-- TOAST -->
    <div id="toast" class="toast"><i class="fa-regular fa-circle-check"></i><span id="toastMsg">Done!</span></div>

    <!-- MODAL -->
    <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box" id="modalBox">

    <script>
        // ================================================================
        // DATA STORE with localStorage persistence
        // ================================================================
        const STORAGE_KEY = 'gallerySocialData_v4';
        let AppData = {};

        function resetData() {
            localStorage.removeItem(STORAGE_KEY);
            initDefaultData();
            saveData();
            renderSidebar();
            renderPage('dashboard');
            showToast('ðŸ”„ Data reset successfully');
        }

        function initDefaultData() {
            AppData = {
                user: { name: 'Yashraj', role: 'Gallery Manager' },
                platforms: [
                    { id: 'fb', name: 'Facebook', icon: 'fa-brands fa-facebook', color: 'text-blue-600',
                        handle: 'GalleryPage', followers: '12.4k', status: 'connected' },
                    { id: 'ig', name: 'Instagram', icon: 'fa-brands fa-instagram', color: 'text-rose-500',
                        handle: '@gallery.india', followers: '8.2k', status: 'connected' },
                    { id: 'wa', name: 'WhatsApp Business', icon: 'fa-brands fa-whatsapp', color: 'text-emerald-500',
                        handle: '+91 98765 43210', followers: '', status: 'connected' },
                    { id: 'gb', name: 'Google Business', icon: 'fa-brands fa-google', color: 'text-amber-500',
                        handle: 'Gallery Profile', followers: '', status: 'connected' },
                    { id: 'x', name: 'X', icon: 'fa-brands fa-x-twitter', color: 'text-black', handle: '@gallery_epay',
                        followers: '', status: 'pending' },
                    { id: 'yt', name: 'YouTube', icon: 'fa-brands fa-youtube', color: 'text-red-600',
                        handle: 'Gallery Channel', followers: '', status: 'connected' },
                    { id: 'pin', name: 'Pinterest', icon: 'fa-brands fa-pinterest', color: 'text-red-400',
                        handle: 'gallery.india', followers: '', status: 'pending' },
                    { id: 'th', name: 'Threads', icon: 'fa-brands fa-threads', color: 'text-black', handle: '@gallery',
                        followers: '', status: 'connected' },
                    { id: 'li', name: 'LinkedIn', icon: 'fa-brands fa-linkedin', color: 'text-sky-700',
                        handle: 'gallery-epay', followers: '', status: 'pending' },
                    { id: 'tg', name: 'Telegram', icon: 'fa-brands fa-telegram', color: 'text-blue-500',
                        handle: 'gallery_offers', followers: '', status: 'pending' },
                ],
                posts: [
                    { id: 1, caption: 'Summer collection 2025', platform: 'Instagram', type: 'Reel',
                        status: 'Published', engagement: 245, date: '2025-05-14' },
                    { id: 2, caption: 'Franchise offer', platform: 'Facebook', type: 'Image', status: 'Published',
                        engagement: 112, date: '2025-05-14' },
                    { id: 3, caption: 'Behind the scenes', platform: 'YouTube', type: 'Video', status: 'Scheduled',
                        engagement: 0, date: '2025-05-16' },
                    { id: 4, caption: 'New arrival reel', platform: 'Instagram', type: 'Reel', status: 'Draft',
                        engagement: 0, date: '' },
                    { id: 5, caption: 'Member spotlight', platform: 'Facebook', type: 'Carousel',
                        status: 'Published', engagement: 89, date: '2025-05-13' },
                ],
                campaigns: [
                    { id: 1, name: 'Festival campaign', reach: '12.4k', roi: '4.2x', status: 'Active' },
                    { id: 2, name: 'Product launch', reach: '8.1k', roi: '2.8x', status: 'Paused' },
                    { id: 3, name: 'Membership drive', reach: '5.3k', roi: '3.1x', status: 'Active' },
                ],
                influencers: [
                    { id: 1, name: '@art_gallery', followers: '12.4k', status: 'active' },
                    { id: 2, name: '@moderncanvas', followers: '8.7k', status: 'pending' },
                    { id: 3, name: '@urbanframes', followers: '5.2k', status: 'active' },
                ],
                offers: [
                    { id: 1, code: 'SUMMER25', clicks: 120, redemptions: 34, status: 'active' },
                    { id: 2, code: 'GALLERY10', clicks: 45, redemptions: 12, status: 'active' },
                ],
                leads: [
                    { id: 1, name: 'Vikram S.', phone: '+91 98765 12345', source: 'Instagram', status: 'New',
                        followup: '' },
                    { id: 2, name: 'Neha G.', phone: '+91 87654 32109', source: 'Facebook', status: 'Converted',
                        followup: '' },
                    { id: 3, name: 'Arjun P.', phone: '+91 76543 21098', source: 'Google', status: 'Follow-up',
                        followup: '2025-05-20' },
                ],
                reviews: { avg: 4.8, total: 23, pending: 2 },
                inbox: { new: 8, urgent: 3 },
                analytics: { reach: 48200, impressions: 124000, engagement: 4.2, leads: 42, conversions: 17,
                    revenue: 3200 },
                mediaAssets: 24,
                mediaCategories: 5,
                stats: {}
            };
            updateStats();
        }

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    AppData = JSON.parse(stored);
                    // ensure all fields exist
                    if (!AppData.platforms) AppData.platforms = [];
                    if (!AppData.posts) AppData.posts = [];
                    if (!AppData.campaigns) AppData.campaigns = [];
                    if (!AppData.influencers) AppData.influencers = [];
                    if (!AppData.offers) AppData.offers = [];
                    if (!AppData.leads) AppData.leads = [];
                    if (!AppData.reviews) AppData.reviews = { avg: 4.8, total: 23, pending: 2 };
                    if (!AppData.inbox) AppData.inbox = { new: 8, urgent: 3 };
                    if (!AppData.analytics) AppData.analytics = { reach: 48200, impressions: 124000, engagement: 4.2,
                        leads: 42, conversions: 17, revenue: 3200 };
                    if (!AppData.stats) AppData.stats = {};
                    if (!AppData.mediaAssets) AppData.mediaAssets = 24;
                    if (!AppData.mediaCategories) AppData.mediaCategories = 5;
                    if (!AppData.user) AppData.user = { name: 'Yashraj', role: 'Gallery Manager' };
                    updateStats();
                    saveData();
                } else {
                    initDefaultData();
                    saveData();
                }
            } catch (e) {
                console.warn('Data load error, resetting:', e);
                initDefaultData();
                saveData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(AppData));
            } catch (e) {
                console.warn('Save error:', e);
            }
        }

        function updateStats() {
            const posts = AppData.posts || [];
            const campaigns = AppData.campaigns || [];
            const leads = AppData.leads || [];
            const platforms = AppData.platforms || [];
            const today = new Date().toISOString().slice(0, 10);
            AppData.stats = {
                accounts: platforms.length,
                publishedToday: posts.filter(p => p.status === 'Published' && p.date === today).length,
                scheduled: posts.filter(p => p.status === 'Scheduled').length,
                drafts: posts.filter(p => p.status === 'Draft').length,
                campaigns: campaigns.length,
                followers: 23400,
                newToday: 127,
                reach: 48200,
                impressions: 124000,
                engagement: 4.2,
                messages: 34,
                reviewsPending: AppData.reviews?.pending || 0,
                adSpendToday: 245,
                monthlyAdSpend: 2800,
                leads: leads.length,
                bookings: 17,
            };
            saveData();
        }

        // ================================================================
        // SIDEBAR NAVIGATION
        // ================================================================
        const menuStructure = [{
            section: 'Overview',
            items: [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
                { id: 'calendar', label: 'Calendar', icon: 'fa-regular fa-calendar' },
                { id: 'planner', label: 'Planner', icon: 'fa-regular fa-file-lines' },
            ]
        }, {
            section: 'Content',
            items: [
                { id: 'posts', label: 'Posts', icon: 'fa-regular fa-pen-to-square' },
                { id: 'media', label: 'Media Library', icon: 'fa-regular fa-image' },
                { id: 'campaigns', label: 'Campaigns', icon: 'fa-regular fa-bullhorn' },
                { id: 'offers', label: 'Offers', icon: 'fa-regular fa-ticket' },
            ]
        }, {
            section: 'Engage',
            items: [
                { id: 'inbox', label: 'Inbox', icon: 'fa-regular fa-inbox', badge: '23' },
                { id: 'reviews', label: 'Reviews', icon: 'fa-regular fa-star' },
                { id: 'influencers', label: 'Influencers', icon: 'fa-regular fa-user-plus' },
            ]
        }, {
            section: 'Analytics',
            items: [
                { id: 'analytics', label: 'Analytics', icon: 'fa-regular fa-chart-line' },
                { id: 'leads', label: 'Leads', icon: 'fa-regular fa-user-tie' },
            ]
        }, {
            section: 'AI Tools',
            items: [
                { id: 'ai-assistant', label: 'AI Assistant', icon: 'fa-regular fa-wand-magic-sparkles' },
            ]
        }, {
            section: 'Settings',
            items: [
                { id: 'settings', label: 'Settings', icon: 'fa-regular fa-gear' },
                { id: 'reset', label: 'â†» Reset Data', icon: 'fa-regular fa-rotate-right' },
            ]
        }, ];

        let currentPage = 'dashboard';

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';
            menuStructure.forEach(group => {
                const div = document.createElement('div');
                const label = document.createElement('span');
                label.className = 'text-[10px] uppercase tracking-wider text-slate-500 font-semibold';
                label.textContent = group.section;
                div.appendChild(label);
                const ul = document.createElement('ul');
                ul.className = 'mt-2 space-y-1';
                group.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className =
                        `sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg ${currentPage === item.id ? 'active' : ''}`;
                    li.dataset.page = item.id;
                    li.innerHTML =
                        `<i class="${item.icon} w-4"></i>${item.label}${item.badge ? `<span class="ml-auto bg-rose-500/80 text-[10px] px-2 py-0.5 rounded-full">${item.badge}</span>` : ''}`;
                    li.addEventListener('click', () => {
                        if (item.id === 'reset') {
                            if (confirm('Reset all data to defaults?')) resetData();
                            return;
                        }
                        navigateTo(item.id);
                    });
                    ul.appendChild(li);
                });
                div.appendChild(ul);
                nav.appendChild(div);
            });
        }

        function navigateTo(pageId) {
            currentPage = pageId;
            renderSidebar();
            renderPage(pageId);
        }

        // ================================================================
        // PAGE RENDERER
        // ================================================================
        function renderPage(pageId) {
            const main = document.getElementById('mainContent');
            if (!main) return;
            main.className = 'flex-1 overflow-y-auto p-5 space-y-6 bg-slate-50/80 fade-in';
            updateStats();
            switch (pageId) {
                case 'dashboard':
                    renderDashboard(main);
                    break;
                case 'posts':
                    renderPosts(main);
                    break;
                case 'campaigns':
                    renderCampaigns(main);
                    break;
                case 'inbox':
                    renderInbox(main);
                    break;
                case 'reviews':
                    renderReviews(main);
                    break;
                case 'media':
                    renderMedia(main);
                    break;
                case 'influencers':
                    renderInfluencers(main);
                    break;
                case 'offers':
                    renderOffers(main);
                    break;
                case 'analytics':
                    renderAnalytics(main);
                    break;
                case 'leads':
                    renderLeads(main);
                    break;
                case 'ai-assistant':
                    renderAIAssistant(main);
                    break;
                case 'calendar':
                    renderCalendar(main);
                    break;
                case 'planner':
                    renderPlanner(main);
                    break;
                case 'settings':
                    renderSettings(main);
                    break;
                default:
                    renderDashboard(main);
            }
        }

        // ---------- DASHBOARD ----------
        function renderDashboard(container) {
            const s = AppData.stats;
            const posts = AppData.posts.slice(0, 4);
            const campaigns = AppData.campaigns.slice(0, 3);
            const platforms = AppData.platforms;

            container.innerHTML = `
            <section class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-3">
              ${[
                ['Accounts', s.accounts, 'fa-hashtag', 'indigo'],
                ['Published today', s.publishedToday, 'fa-pen-to-square', 'emerald'],
                ['Scheduled', s.scheduled, 'fa-clock', 'amber'],
                ['Drafts', s.drafts, 'fa-file-lines', 'rose'],
                ['Campaigns', s.campaigns, 'fa-bullhorn', 'purple'],
                ['Followers', formatNum(s.followers), 'fa-users', 'sky'],
                ['New today', s.newToday, 'fa-user-plus', 'teal'],
                ['Reach', formatNum(s.reach), 'fa-eye', 'blue'],
                ['Impressions', formatNum(s.impressions), 'fa-chart-simple', 'violet'],
                ['Engagement', s.engagement+'%', 'fa-heart', 'pink'],
                ['Messages', s.messages, 'fa-message', 'orange'],
                ['Reviews pending', s.reviewsPending, 'fa-star', 'cyan'],
                ['Ad spend (today)','$${s.adSpendToday}','fa-credit-card','rose'],

        // ---------- CALENDAR ----------

            for (let i = 1; i <= daysInMonth; i++) days.push(i);

            container.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
              <div class="flex items-center justify-between flex-wrap gap-3">
                <h2 class="font-bold text-lg text-slate-800"><i class="fa-regular fa-calendar mr-2 text-indigo-500"></i>Content Calendar - ${today.toLocaleString('default', { month: 'long' })} ${year}</h2>

              <div class="grid grid-cols-7 text-center text-sm gap-y-2 mt-2">
                ${days.map((d) => {
                  const isToday = d === today.getDate();
                  const dateStr = d ? `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}` : '';
                  const hasPost = d ? AppData.posts.some(p => p.date === dateStr) : false;
                  return `<div class="py-1 ${isToday ? 'bg-indigo-600 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center mx-auto' : d ? 'hover:bg-slate-100 rounded-full w-8 h-8 flex items-center justify-center mx-auto cursor-pointer' : 'text-slate-300'} ${hasPost && !isToday ? 'ring-2 ring-indigo-300' : ''}">${d || ''}</div>`;

          `;

        function formatNum(n) {

            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return n;
        }

        let toastTimer;

            toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
