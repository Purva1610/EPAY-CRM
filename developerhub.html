<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Hub â€” Enterprise ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0b0d11;
            --bg-secondary: #13161c;
            --bg-card: #1a1f2a;
            --bg-hover: #242b3a;
            --bg-input: #1a1f2a;
            --border-color: #2a3142;
            --text-primary: #e8edf5;
            --text-secondary: #8b95b0;
            --text-muted: #5a6480;
            --accent: #6c8cff;
            --accent-hover: #5a7ae8;
            --accent-glow: rgba(108, 140, 255, 0.15);
            --success: #4ade80;
            --warning: #facc15;
            --danger: #f87171;
            --info: #60a5fa;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: all 0.25s ease;
            --sidebar-width: 260px;
            --header-height: 64px;
        }
        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* â”€â”€â”€ LAYOUT â”€â”€â”€ */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* â”€â”€â”€ SIDEBAR â”€â”€â”€ */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
            z-index: 100;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            min-height: var(--header-height);
            flex-shrink: 0;
        }
        .sidebar-brand .logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-brand h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff 60%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand .badge {
            font-size: 9px;
            background: var(--accent);
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: #fff;
            margin-left: auto;
        }
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 20px;
        }
        .sidebar-nav .nav-group {
            margin-bottom: 6px;
        }
        .sidebar-nav .nav-group-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 12px 12px 6px;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            position: relative;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .sidebar-nav .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
        }
        .sidebar-nav .nav-item.active::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            border-radius: 4px;
            background: var(--accent);
        }
        .sidebar-nav .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item .count {
            margin-left: auto;
            font-size: 11px;
            background: var(--bg-card);
            padding: 1px 10px;
            border-radius: 20px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* â”€â”€â”€ MAIN â”€â”€â”€ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        /* â”€â”€â”€ HEADER â”€â”€â”€ */
        .header {
            height: var(--header-height);
            min-height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-left .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }
        .header-left .page-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .header-left .page-title small {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 13px;
            margin-left: 8px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-right .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0 14px;
            gap: 10px;
            transition: var(--transition);
        }
        .header-right .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .header-right .search-box input {
            background: none;
            border: none;
            padding: 8px 0;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 180px;
        }
        .header-right .search-box input::placeholder {
            color: var(--text-muted);
        }
        .header-right .search-box i {
            color: var(--text-muted);
            font-size: 14px;
        }
        .header-right .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-right .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .header-right .header-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            position: absolute;
            top: 6px;
            right: 6px;
            border: 2px solid var(--bg-secondary);
        }
        .header-right .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* â”€â”€â”€ CONTENT â”€â”€â”€ */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 30px;
        }

        /* â”€â”€â”€ CARDS / STATS â”€â”€â”€ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 20px;
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .stat-card .label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            margin: 4px 0 2px;
            letter-spacing: -0.5px;
        }
        .stat-card .change {
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .stat-card .change.up {
            color: var(--success);
            background: rgba(74, 222, 128, 0.12);
        }
        .stat-card .change.down {
            color: var(--danger);
            background: rgba(248, 113, 113, 0.12);
        }
        .stat-card .change.neutral {
            color: var(--text-muted);
            background: rgba(139, 149, 176, 0.12);
        }
        .stat-card .icon {
            float: right;
            font-size: 28px;
            color: var(--accent);
            opacity: 0.3;
        }

        /* â”€â”€â”€ CHARTS â”€â”€â”€ */
        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
        }
        .chart-box .chart-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .chart-box canvas {
            max-height: 200px;
            max-width: 100%;
        }

        /* â”€â”€â”€ TABLE WRAPPER â”€â”€â”€ */
        .table-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-toolbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .table-toolbar .left h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .table-toolbar .left .count-badge {
            font-size: 12px;
            background: var(--bg-hover);
            padding: 1px 12px;
            border-radius: 20px;
            color: var(--text-secondary);
        }
        .table-toolbar .right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .table-toolbar .right .filter-select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .table-toolbar .right .filter-select:focus {
            border-color: var(--accent);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-success {
            background: var(--success);
            color: #0b0d11;
        }
        .btn-success:hover {
            opacity: 0.85;
        }
        .btn-danger {
            background: var(--danger);
            color: #0b0d11;
        }
        .btn-danger:hover {
            opacity: 0.85;
        }
        .btn-warning {
            background: var(--warning);
            color: #0b0d11;
        }
        .btn-warning:hover {
            opacity: 0.85;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-ghost:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            justify-content: center;
            border-radius: var(--radius-sm);
        }

        /* â”€â”€â”€ TABLE â”€â”€â”€ */
        .table-scroll {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table thead {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        table thead th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 5;
        }
        table tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            vertical-align: middle;
        }
        table tbody tr:hover {
            background: var(--bg-hover);
        }
        table tbody tr:last-child td {
            border-bottom: none;
        }
        table .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
        }
        table .status-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-badge.active {
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
        }
        .status-badge.active .dot {
            background: var(--success);
        }
        .status-badge.inactive {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
        }
        .status-badge.inactive .dot {
            background: var(--danger);
        }
        .status-badge.pending {
            background: rgba(250, 204, 21, 0.15);
            color: var(--warning);
        }
        .status-badge.pending .dot {
            background: var(--warning);
        }
        .status-badge.info {
            background: rgba(96, 165, 250, 0.15);
            color: var(--info);
        }
        .status-badge.info .dot {
            background: var(--info);
        }
        .status-badge.draft {
            background: rgba(139, 149, 176, 0.15);
            color: var(--text-muted);
        }
        .status-badge.draft .dot {
            background: var(--text-muted);
        }
        table .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        table .actions .btn {
            padding: 3px 8px;
            font-size: 12px;
        }

        /* â”€â”€â”€ MODAL â”€â”€â”€ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            max-width: 680px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-size: 17px;
            font-weight: 600;
        }
        .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-header .close-btn:hover {
            color: var(--text-primary);
        }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 20px;
        }
        .modal-body .form-grid .full {
            grid-column: 1 / -1;
        }
        .modal-body .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal-body .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .modal-body .form-group input,
        .modal-body .form-group select,
        .modal-body .form-group textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
        }
        .modal-body .form-group input:focus,
        .modal-body .form-group select:focus,
        .modal-body .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .modal-body .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-footer {
            padding: 14px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        /* â”€â”€â”€ RESPONSIVE â”€â”€â”€ */
        @media (max-width: 1024px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                height: 100%;
                z-index: 200;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
                transition: left 0.3s ease;
            }
            .sidebar.open {
                left: 0;
            }
            .header-left .menu-toggle {
                display: block;
            }
            .header-right .search-box input {
                width: 120px;
            }
            .header-right .search-box {
                padding: 0 10px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .modal-body .form-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                max-width: 100%;
                margin: 10px;
                max-height: 95vh;
            }
            .table-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .table-toolbar .right {
                flex-wrap: wrap;
            }
            .content {
                padding: 14px 14px 20px;
            }
            .header {
                padding: 0 14px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header-right .search-box input {
                width: 80px;
            }
            .header-right .search-box {
                padding: 0 8px;
            }
            .header-right .header-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            .header-right .avatar {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
        }

        /* overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
        }
        .sidebar-overlay.open {
            display: block;
        }

        /* â”€â”€â”€ UTILITIES â”€â”€â”€ */
        .text-muted {
            color: var(--text-muted);
        }
        .text-success {
            color: var(--success);
        }
        .text-danger {
            color: var(--danger);
        }
        .text-warning {
            color: var(--warning);
        }
        .text-accent {
            color: var(--accent);
        }
        .fw-600 {
            font-weight: 600;
        }
        .gap-2 {
            gap: 8px;
        }
        .flex {
            display: flex;
        }
        .flex-center {
            display: flex;
            align-items: center;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .hidden {
            display: none !important;
        }
        .table-empty {
            padding: 40px 20px;
            text-align: center;

        let currentSection = 'dashboard';

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            const groups = {};
            for (const s of SECTIONS) {
                if (!groups[s.group]) groups[s.group] = [];
                groups[s.group].push(s);
            }
            let html = '';
            for (const [group, items] of Object.entries(groups)) {
                html += `<div class="nav-group"><div class="nav-group-title">${group}</div>`;
                for (const s of items) {
                    const active = s.id === currentSection ? 'active' : '';
                    const count = DB[s.id] ? DB[s.id].length : 0;
                    html += `<div class="nav-item ${active}" data-section="${s.id}">
                                <i class="fas ${s.icon}"></i> ${s.label}
                                ${count > 0 ? `<span class="count">${count}</span>` : ''}
                            </div>`;
                }
                html += '</div>';
            }
            nav.innerHTML = html;

            // click handler
            nav.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.section;
                    if (id) navigateTo(id);
                });
            });
        }

        function navigateTo(sectionId) {
            currentSection = sectionId;
            renderSidebar();
            renderContent(sectionId);
            // close mobile sidebar
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
            // update page title
            const label = getSectionLabel(sectionId);
            document.getElementById('pageTitle').innerHTML = `${label} <small>${sectionId === 'dashboard' ? 'overview' : 'management'}</small>`;
        }

        function renderContent(sectionId) {
            const container = document.getElementById('mainContent');
            if (sectionId === 'dashboard') {
                container.innerHTML = renderDashboard();
                initDashboardCharts();
                return;
            }
            container.innerHTML = renderTable(sectionId);
            // attach event listeners for this section
            attachTableEvents(sectionId);
        }

            for (const key of Object.keys(chartInstances)) {
                try { chartInstances[key].destroy(); } catch (e) {}
            }
            chartInstances = {};

            // Velocity chart
            const velCtx = document.getElementById('velocityChart');
            if (velCtx) {
                const sprints = DB.sprint || [];
                const labels = sprints.map(s => s.name || 'Sprint');
                const data = sprints.map(s => s.velocity || 0);
                chartInstances.velocity = new Chart(velCtx, {
                    type: 'bar',
                    data: {
                        labels: labels.length ? labels : ['Sprint 1', 'Sprint 2', 'Sprint 3'],
                        datasets: [{
                            label: 'Velocity',
                            data: data.length ? data : [32, 38, 42],
                            backgroundColor: 'rgba(108, 140, 255, 0.6)',
                            borderColor: '#6c8cff',
                            borderWidth: 2,
                            borderRadius: 4,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' },
                            ticks: { color: '#5a6480' } },
                            x: { grid: { display: false }, ticks: { color: '#5a6480' } }
                        }
                    }
                });
            }

            // Task status chart
            const taskCtx = document.getElementById('taskStatusChart');
            if (taskCtx) {
                const tasks = DB.task || [];
                const statuses = ['Open', 'In Progress', 'Review', 'Done', 'Blocked'];
                const counts = statuses.map(s => tasks.filter(t => t.status === s).length);
                chartInstances.taskStatus = new Chart(taskCtx, {
                    type: 'doughnut',
                    data: {
                        labels: statuses,
                        datasets: [{
                            data: counts.every(c => c === 0) ? [4, 3, 2, 5, 1] : counts,
                            backgroundColor: ['#facc15', '#60a5fa', '#8b95b0', '#4ade80', '#f87171'],
                            borderColor: 'transparent',
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { position: 'right', labels: { color: '#8b95b0', boxWidth: 12 } } },
                        cutout: '65%',
                    }
                });
            }
        }

        function renderTable(sectionId) {
            const data = DB[sectionId] || [];
            const columns = getColumns(sectionId);
            const label = getSectionLabel(sectionId);

            if (!columns.length) {
                return `<div class="table-wrapper"><div class="table-empty"><i class="fas fa-table"></i><p>No fields defined for ${label}</p></div></div>`;
            }

            let headerHtml = columns.map(col => `<th>${col.replace(/_/g,' ').toUpperCase()}</th>`).join('');
            headerHtml += '<th style="text-align:right;">Actions</th>';

            let bodyHtml = '';
            if (data.length === 0) {
                bodyHtml =
                `<tr><td colspan="${columns.length + 1}" class="table-empty"><i class="fas fa-inbox"></i><p>No records found</p></td></tr>`;
            } else {
                for (const row of data) {
                    let rowHtml = '';
                    for (const col of columns) {
                        const val = row[col];
                        // Special rendering for status fields
                        if (col === 'status' || col === 'severity' || col === 'priority' || col === 'level') {
                            rowHtml += `<td>${getStatusBadge(val)}</td>`;
                        } else {
                            rowHtml += `<td>${formatValue(val)}</td>`;
                        }
                    }
                    rowHtml += `<td style="text-align:right;">
                                <div class="actions">
                                    <button class="btn btn-sm btn-primary edit-btn" data-id="${row.id}"><i class="fas fa-pen"></i></button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${row.id}"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>`;
                    bodyHtml += `<tr>${rowHtml}</tr>`;
                }
            }

            return `
                        <div class="table-wrapper">
                            <div class="table-toolbar">
                                <div class="left">
                                    <h3>${label}</h3>
                                    <span class="count-badge">${data.length} records</span>
                                </div>
                                <div class="right">
                                    <button class="btn btn-primary btn-sm" id="addRecordBtn"><i class="fas fa-plus"></i> Add</button>
                                </div>
                            </div>
                            <div class="table-scroll">
                                <table>
                                    <thead><tr>${headerHtml}</tr></thead>
                                    <tbody>${bodyHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
        }

        function attachTableEvents(sectionId) {
            // Add button
            const addBtn = document.getElementById('addRecordBtn');
            if (addBtn) {
                addBtn.addEventListener('click', () => openModal(sectionId, null));
            }

            // Edit buttons
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    openModal(sectionId, id);
                });
            });

            // Delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    if (confirm('Delete this record?')) {
                        const data = DB[sectionId] || [];
                        DB[sectionId] = data.filter(r => r.id !== id);
                        renderContent(sectionId);
                        renderSidebar();
                    }
                });
            });
        }

        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”
        //  MODAL
        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”

        let modalSection = '';
        let modalEditId = null;

        function openModal(sectionId, editId) {
            modalSection = sectionId;
            modalEditId = editId;
            const fields = getFields(sectionId);
            const data = DB[sectionId] || [];
            const record = editId ? data.find(r => r.id === editId) : null;
            const label = getSectionLabel(sectionId);

            document.getElementById('modalTitle').textContent = record ? `Edit ${label}` : `Add ${label}`;

            let formHtml = '<div class="form-grid">';
            for (const f of fields) {
                const val = record ? (record[f.key] ?? '') : '';
                let input = '';
                if (f.type === 'select') {
                    const opts = (f.options || []).map(o =>
                        `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`
                    ).join('');
                    input = `<select id="field_${f.key}">${opts}</select>`;
                } else if (f.type === 'textarea') {
                    input = `<textarea id="field_${f.key}" rows="2">${val}</textarea>`;
                } else {
                    input = `<input type="${f.type || 'text'}" id="field_${f.key}" value="${val}" />`;
                }
                formHtml += `<div class="form-group">
                            <label>${f.label}</label>
                            ${input}
                        </div>`;
            }
            formHtml += '</div>';

            document.getElementById('modalBody').innerHTML = formHtml;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            modalSection = '';
            modalEditId = null;
        }

        function saveModal() {
            const sectionId = modalSection;
            const editId = modalEditId;
            const fields = getFields(sectionId);
            const data = DB[sectionId] || [];

            const record = {};
            let valid = true;
            for (const f of fields) {
                const el = document.getElementById(`field_${f.key}`);
                if (el) {
                    let val = el.value;
                    if (f.type === 'number') val = parseFloat(val) || 0;
                    record[f.key] = val;
                } else {
                    record[f.key] = '';
                }
            }

            if (editId) {
                // Edit existing
                const idx = data.findIndex(r => r.id === editId);
                if (idx !== -1) {
                    // Preserve id
                    record.id = editId;
                    data[idx] = { ...data[idx], ...record };
                    DB[sectionId] = data;
                }
            } else {
                // Add new
                const maxId = data.reduce((max, r) => Math.max(max, r.id || 0), 0);
                record.id = maxId + 1;
                data.push(record);
                DB[sectionId] = data;
            }

            closeModal();
            renderContent(sectionId);
            renderSidebar();
        }

        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”
        //  EVENT BINDINGS
        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”

        // Menu toggle
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
        });

        // Modal controls
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalCancel').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.getElementById('modalSave').addEventListener('click', saveModal);

        // Global search
        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            if (!q) {
                renderContent(currentSection);
                return;
            }
            const data = DB[currentSection] || [];
            const filtered = data.filter(row => {
                return Object.values(row).some(v =>
                    String(v).toLowerCase().includes(q)
                );
            });
            // Re-render with filtered data
            const container = document.getElementById('mainContent');
            if (currentSection === 'dashboard') {
                // search on dashboard shows a filtered list
                return;
            }
            container.innerHTML = renderTableWithData(currentSection, filtered);
            attachTableEvents(currentSection);
        });

        function renderTableWithData(sectionId, data) {
            const columns = getColumns(sectionId);
            const label = getSectionLabel(sectionId);
            if (!columns.length) return `<div class="table-wrapper"><div class="table-empty"><p>No fields</p></div></div>`;

            let headerHtml = columns.map(col => `<th>${col.replace(/_/g,' ').toUpperCase()}</th>`).join('');
            headerHtml += '<th style="text-align:right;">Actions</th>';

            let bodyHtml = '';
            if (data.length === 0) {
                bodyHtml =
                `<tr><td colspan="${columns.length + 1}" class="table-empty"><i class="fas fa-search"></i><p>No matching records</p></td></tr>`;
            } else {
                for (const row of data) {
                    let rowHtml = '';
                    for (const col of columns) {
                        const val = row[col];
                        if (col === 'status' || col === 'severity' || col === 'priority' || col === 'level') {
                            rowHtml += `<td>${getStatusBadge(val)}</td>`;
                        } else {
                            rowHtml += `<td>${formatValue(val)}</td>`;
                        }
                    }
                    rowHtml += `<td style="text-align:right;">
                                <div class="actions">
                                    <button class="btn btn-sm btn-primary edit-btn" data-id="${row.id}"><i class="fas fa-pen"></i></button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${row.id}"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>`;
                    bodyHtml += `<tr>${rowHtml}</tr>`;
                }
            }

            return `
                        <div class="table-wrapper">
                            <div class="table-toolbar">
                                <div class="left">
                                    <h3>${label}</h3>
                                    <span class="count-badge">${data.length} records (filtered)</span>
                                </div>
                                <div class="right">
                                    <button class="btn btn-primary btn-sm" id="addRecordBtn"><i class="fas fa-plus"></i> Add</button>
                                </div>
                            </div>
                            <div class="table-scroll">
                                <table>
                                    <thead><tr>${headerHtml}</tr></thead>
                                    <tbody>${bodyHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
        }

        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”
        //  KEYBOARD SHORTCUTS
        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('globalSearch').focus();
            }
        });

        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”
        //  BOOT
        // â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”

        renderSidebar();
        renderContent('dashboard');
        document.getElementById('pageTitle').innerHTML = 'Dashboard <small>overview</small>';

        console.log('ðŸš€ Developer Hub ERP loaded');
        console.log(`ðŸ“Š ${Object.keys(DB).reduce((acc, k) => acc + DB[k].length, 0)} total records across ${Object.keys(DB).length} sections`);
    </script>

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
