<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>



        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f1f5f9;
        }
        .sidebar-link {
            transition: all 0.15s;
            cursor: pointer;
            display: flex !important;
            align-items: center !important;
            gap: 0.75rem !important;
            padding: 0.5rem 0.75rem !important;
            border-radius: 0.5rem !important;
        }
        .sidebar-link:hover {
            background: #1e293b;
        }
        .sidebar-link.active {
            background: #1e3a5f;
            color: white;
        }
        .sidebar-link.active i {
            color: #818cf8;
        }
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 20px;
        }
        .card-hover {
            transition: all 0.2s;
        }
        .card-hover:hover {
            box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0b0f19;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            color: #34d399;
            font-size: 18px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 600px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-box input,
        .modal-box select,
        .modal-box textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            margin-top: 6px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-box input:focus,
        .modal-box select:focus,
        .modal-box textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .modal-box label {
            font-weight: 500;
            font-size: 13px;
            color: #334155;
            margin-top: 14px;
            display: block;
        }
        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .modal-box .form-row {
                grid-template-columns: 1fr;
            }
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.completed {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.review {
            background: #e0f2fe;
            color: #0284c7;
        }
        .status-badge.error {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-badge.verified {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.missing {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-badge.rejected {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-badge.approved {
            background: #dcfce7;
            color: #16a34a;
        }
        .status-badge.critical {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-badge.warning {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.positive {
            background: #dcfce7;
            color: #16a34a;
        }
        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            transition: 0.15s;
        }
        .delete-btn:hover {
            color: #dc2626;
            transform: scale(1.1);
        }
        .edit-btn {
            color: #4f46e5;
            cursor: pointer;
            transition: 0.15s;
        }
        .edit-btn:hover {
            color: #4338ca;
        }
        .scrollable-table {
            overflow-x: auto;
        }
        .scrollable-table table {
            min-width: 600px;
        }
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
        }
        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }
        .drill-card {
            cursor: pointer;
        }
        .drill-card:hover {
            box-shadow: 0 8px 25px -8px rgba(0, 0, 0, 0.15);
        }
        .chart-bar {
            height: 8px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .chart-bar .fill {
            height: 100%;
            border-radius: 999px;
        }
        .progress-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            position: relative;
        }
        .progress-ring .bg {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(var(--color) var(--pct), #e2e8f0 var(--pct));
        }
        .progress-ring .inner {
            position: relative;
            z-index: 2;
            background: white;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #0b0f19;
        }
    </style>
</head>
    <!-- Global Navigation Component -->
    <div id="nav-container"></div>
    <script>
        (function() {
            var navContainer = document.getElementById('nav-container');
            if (navContainer) {
                fetch('navigation-component.html')
                    .then(response => response.text())
                    .then(html => {
                        navContainer.innerHTML = html;
                    })
                    .catch(err => console.error('Navigation load error:', err));
            }
        })();
    </script>
<body>


    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#0b0f19] text-white/80 flex flex-col shrink-0 h-full border-r border-slate-800/60 fixed inset-y-0 left-0 z-50">

                <div class="relative">

        <!-- SCROLLABLE MAIN -->
        <main class="flex-1 overflow-y-auto p-5 space-y-6 bg-slate-50/80" id="mainContent">

        </main>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"><i class="fa-regular fa-circle-check"></i><span id="toastMsg">Done!</span></div>

    <!-- MODAL -->
    <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box" id="modalBox">
            <!-- filled by JS -->
        </div>
    </div>

    <script>
        // ================================================================
        // DATA STORE
        // ================================================================
        const STORAGE_KEY = 'hqHeadData_v1';
        let AppData = {};

                        target: 5000000, employees: 45, present: 38, absent: 5, leave: 2, newCustomers: 120,

                    { id: 4, districtId: 2, name: 'Gallery Delta', manager: 'Priya', revenue: 550000, target: 600000,
                        achievement: 92, customers: 80, newCustomers: 14, leads: 20, conversion: 70, expenses: 42000,
                        collection: 490000, outstanding: 60000, complaints: 1, staffPresent: 7, performance: 90 },
                    { id: 5, districtId: 3, name: 'Gallery Epsilon', manager: 'Vikram', revenue: 650000, target: 700000,
                        achievement: 93, customers: 90, newCustomers: 18, leads: 25, conversion: 72, expenses: 48000,
                        collection: 580000, outstanding: 70000, complaints: 0, staffPresent: 8, performance: 92 },
                    { id: 6, districtId: 3, name: 'Gallery Zeta', manager: 'Anita', revenue: 550000, target: 600000,
                        achievement: 92, customers: 85, newCustomers: 16, leads: 22, conversion: 73, expenses: 44000,
                        collection: 490000, outstanding: 60000, complaints: 1, staffPresent: 7, performance: 90 },
                ],
                employees: [
                    { id: 1, name: 'Rajesh', role: 'Gallery Manager', galleryId: 1, present: true, tasks: 5,
                        revenue: 600000, leads: 18, visits: 25, dailyReport: true },
                    { id: 2, name: 'Sneha', role: 'Gallery Manager', galleryId: 2, present: true, tasks: 4,
                        revenue: 700000, leads: 22, visits: 20, dailyReport: true },
                    { id: 3, name: 'Amit', role: 'Gallery Manager', galleryId: 3, present: false, tasks: 3,
                        revenue: 500000, leads: 15, visits: 18, dailyReport: false },
                    { id: 4, name: 'Priya', role: 'Gallery Manager', galleryId: 4, present: true, tasks: 6,
                        revenue: 550000, leads: 20, visits: 22, dailyReport: true },
                    { id: 5, name: 'Vikram', role: 'Gallery Manager', galleryId: 5, present: true, tasks: 5,
                        revenue: 650000, leads: 25, visits: 30, dailyReport: true },
                    { id: 6, name: 'Anita', role: 'Gallery Manager', galleryId: 6, present: true, tasks: 4,
                        revenue: 550000, leads: 22, visits: 24, dailyReport: true },
                    { id: 7, name: 'Suresh', role: 'BDE', galleryId: null, present: true, tasks: 8, revenue: 0,
                        leads: 30, visits: 40, dailyReport: true },
                    { id: 8, name: 'Meena', role: 'BDO', galleryId: null, present: true, tasks: 6, revenue: 0,
                        leads: 20, visits: 35, dailyReport: true },
                    { id: 9, name: 'Arjun', role: 'Marketing Executive', galleryId: null, present: true, tasks: 7,
                        revenue: 0, leads: 45, visits: 15, dailyReport: true },
                ],
                tasks: [
                    { id: 1, title: 'Review district performance', assignedTo: 'Rajesh', due: '2025-05-20',
                        priority: 'High', status: 'Pending', category: 'Review' },
                    { id: 2, title: 'Submit monthly report', assignedTo: 'Sneha', due: '2025-05-18', priority: 'Medium',
                        status: 'In Progress', category: 'Reporting' },
                    { id: 3, title: 'Field visit to Gallery Gamma', assignedTo: 'Amit', due: '2025-05-17',
                        priority: 'Low', status: 'Pending', category: 'Visit' },
                ],
                complaints: [
                    { id: 1, galleryId: 1, customer: 'Ravi', issue: 'Billing error', status: 'Open', priority: 'High',
                        created: '2025-05-15' },
                    { id: 2, galleryId: 2, customer: 'Sita', issue: 'Delay in delivery', status: 'In Progress',
                        priority: 'Medium', created: '2025-05-14' },
                ],
                leads: [
                    { id: 1, customer: 'ABC Corp', source: 'Marketing', status: 'Interested', assignedTo: 'Suresh',
                        value: 50000, created: '2025-05-15' },
                    { id: 2, customer: 'XYZ Ltd', source: 'Referral', status: 'Follow-up', assignedTo: 'Meena',
                        value: 30000, created: '2025-05-14' },
                ],
                collections: [
                    { id: 1, customer: 'Art Gallery', amount: 25000, date: '2025-05-15', status: 'Paid' },
                    { id: 2, customer: 'Modern Arts', amount: 15000, date: '2025-05-14', status: 'Overdue' },
                ],
                dailyReports: [
                    { employeeId: 1, date: '2025-05-16', tasksCompleted: 4, visits: 5, revenue: 120000, leads: 3,
                        status: 'Submitted' },
                ],
                stats: {}
            };
            updateStats();
            saveData();
        }

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    AppData = JSON.parse(stored);
                    // Ensure arrays
                    if (!AppData.hqs) AppData.hqs = [];
                    if (!AppData.districts) AppData.districts = [];
                    if (!AppData.galleries) AppData.galleries = [];
                    if (!AppData.employees) AppData.employees = [];
                    if (!AppData.tasks) AppData.tasks = [];
                    if (!AppData.complaints) AppData.complaints = [];
                    if (!AppData.leads) AppData.leads = [];
                    if (!AppData.collections) AppData.collections = [];
                    if (!AppData.dailyReports) AppData.dailyReports = [];
                    if (!AppData.stats) AppData.stats = {};
                    if (!AppData.user) AppData.user = { name: 'Vikram', role: 'HQ Head' };
                    updateStats();
                    saveData();
                } else {
                    initDefaultData();
                    saveData();
                }
            } catch (e) {
                console.warn('Data load error, resetting', e);
                initDefaultData();
                saveData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(AppData));
            } catch (e) {}
        }

        function updateStats() {
            const hqs = AppData.hqs || [];
            const districts = AppData.districts || [];
            const galleries = AppData.galleries || [];
            const employees = AppData.employees || [];
            const tasks = AppData.tasks || [];
            const complaints = AppData.complaints || [];
            const leads = AppData.leads || [];
            const collections = AppData.collections || [];

            const totalRevenue = hqs.reduce((s, h) => s + h.revenue, 0);
            const totalTarget = hqs.reduce((s, h) => s + h.target, 0);
            const totalEmployees = employees.length;
            const present = employees.filter(e => e.present).length;
            const absent = employees.filter(e => !e.present).length;
            const totalGalleries = galleries.length;
            const totalDistricts = districts.length;
            const totalLeads = leads.length;
            const totalCollections = collections.reduce((s, c) => s + (c.status === 'Paid' ? c.amount : 0), 0);
            const totalOutstanding = collections.reduce((s, c) => s + (c.status === 'Overdue' ? c.amount : 0), 0);
            const pendingTasks = tasks.filter(t => t.status === 'Pending').length;
            const criticalIssues = complaints.filter(c => c.priority === 'High' && c.status !== 'Resolved').length;

            AppData.stats = {
                hqs: hqs.length,
                districts: totalDistricts,
                galleries: totalGalleries,
                employees: totalEmployees,
                present: present,
                absent: absent,
                todayRevenue: 450000, // simulated
                monthlyRevenue: totalRevenue,
                monthlyTarget: totalTarget,
                targetAchievement: totalTarget ? Math.round((totalRevenue / totalTarget) * 100) : 0,
                newCustomers: 45,
                newLeads: totalLeads,
                collections: totalCollections,
                outstanding: totalOutstanding,
                pendingTasks: pendingTasks,
                criticalIssues: criticalIssues,
                totalTasks: tasks.length,
            };
            saveData();
        }

        // ================================================================
        // SIDEBAR
        // ================================================================
        const menuStructure = [
            { section: 'Overview', items: [{ id: 'dashboard', label: 'Dashboard', icon: 'fa-house' }] },
            { section: 'HQ', items: [
                    { id: 'hq-performance', label: 'HQ Performance', icon: 'fa-regular fa-building' },
                    { id: 'district-performance', label: 'District Performance', icon: 'fa-regular fa-layer-group' },
                    { id: 'gallery-performance', label: 'Gallery Performance', icon: 'fa-regular fa-images' },
                ] },
            { section: 'Team', items: [
                    { id: 'team-performance', label: 'Team Performance', icon: 'fa-regular fa-users' },
                    { id: 'bde-performance', label: 'BDE Performance', icon: 'fa-regular fa-user-tie' },
                    { id: 'bdo-performance', label: 'BDO Performance', icon: 'fa-regular fa-user-check' },
                    { id: 'marketing-performance', label: 'Marketing Executive', icon: 'fa-regular fa-bullhorn' },
                ] },
            { section: 'Field', items: [
                    { id: 'field-visits', label: 'Field Visit Monitoring', icon: 'fa-regular fa-location-dot' },
                ] },
            { section: 'Operations', items: [
                    { id: 'tasks', label: 'Daily Tasks', icon: 'fa-regular fa-list-check' },
                    { id: 'daily-reports', label: 'Daily Reports', icon: 'fa-regular fa-file-lines' },
                    { id: 'complaints', label: 'Complaints', icon: 'fa-regular fa-message' },
                    { id: 'leads', label: 'Leads', icon: 'fa-regular fa-user-plus' },
                    { id: 'collections', label: 'Collections', icon: 'fa-regular fa-hand-holding-usd' },
                    { id: 'expenses', label: 'Expense Monitoring', icon: 'fa-regular fa-coins' },
                ] },
            { section: 'Settings', items: [
                    { id: 'settings', label: 'Settings', icon: 'fa-regular fa-gear' },
                ] },
        ];

        let currentPage = 'dashboard';
        let drillContext = null; // for drill-down

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';
            menuStructure.forEach(group => {
                const div = document.createElement('div');
                const label = document.createElement('span');
                label.className = 'text-[10px] uppercase tracking-wider text-slate-500 font-semibold';
                label.textContent = group.section;
                div.appendChild(label);
                const ul = document.createElement('ul');
                ul.className = 'mt-2 space-y-1';
                group.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className =
                        `sidebar-link ${currentPage === item.id ? 'active' : ''}`;
                    li.dataset.page = item.id;
                    li.innerHTML = `<i class="${item.icon} w-4"></i>${item.label}`;
                    li.addEventListener('click', () => {
                        drillContext = null;
                        navigateTo(item.id);
                    });
                    ul.appendChild(li);
                });

        function renderCollections(container) {
            const collections = AppData.collections;
            container.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
              <h2 class="font-bold text-lg text-slate-800"><i class="fa-regular fa-hand-holding-usd mr-2 text-emerald-500"></i>Collections</h2>
              <div class="overflow-x-auto mt-4"><table class="w-full text-sm"><thead><tr class="text-slate-400 border-b"><th class="pb-3 text-left">Customer</th><th class="pb-3 text-left">Amount</th><th class="pb-3 text-left">Date</th><th class="pb-3 text-left">Status</th></tr></thead>
                <tbody>${collections.map(c => `
                  <tr><td>${c.customer}</td><td>₹${formatNum(c.amount)}</td><td>${c.date}</td><td><span class="status-badge ${c.status === 'Paid' ? 'positive' : 'critical'}">${c.status}</span></td></tr>
                `).join('')}</tbody></table></div>
            </div>
          `;
        }

        // ---------- EXPENSES ----------
        function renderExpenses(container) {
            container.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
              <h2 class="font-bold text-lg text-slate-800"><i class="fa-regular fa-coins mr-2 text-amber-500"></i>Expense Monitoring</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-4">
                <div class="bg-slate-50 p-3 rounded"><span class="text-xs text-slate-400">HQ Expenses</span><p class="font-bold">₹2,45,000</p></div>
                <div class="bg-slate-50 p-3 rounded"><span class="text-xs text-slate-400">District Expenses</span><p class="font-bold">₹1,20,000</p></div>
                <div class="bg-slate-50 p-3 rounded"><span class="text-xs text-slate-400">Marketing Expenses</span><p class="font-bold">₹85,000</p></div>
                <div class="bg-slate-50 p-3 rounded"><span class="text-xs text-slate-400">Travel Expenses</span><p class="font-bold">₹42,000</p></div>
                <div class="bg-slate-50 p-3 rounded"><span class="text-xs text-slate-400">Budget</span><p class="font-bold">₹5,00,000</p></div>
                <div class="bg-slate-50 p-3 rounded"><span class="text-xs text-slate-400">Variance</span><p class="font-bold text-rose-500">-₹8,000</p></div>
              </div>
            </div>
          `;
        }

        // ================================================================
        // UTILITY
        // ================================================================
        function formatNum(n) {
            if (n >= 10000000) return (n / 10000000).toFixed(1) + 'Cr';
            if (n >= 100000) return (n / 100000).toFixed(1) + 'L';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return n;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function quickAction(action) {
            showToast('⚡ ' + action);
            if (action.includes('View HQ')) navigateTo('hq-performance');
            else if (action.includes('View Districts')) navigateTo('district-performance');
            else if (action.includes('View Galleries')) navigateTo('gallery-performance');
            else if (action.includes('View Employees')) navigateTo('team-performance');
            else if (action.includes('View BDE')) navigateTo('bde-performance');
            else if (action.includes('View BDO')) navigateTo('bdo-performance');
            else if (action.includes('View Marketing')) navigateTo('marketing-performance');
        }

        function drill(label) {
            showToast('🔍 Drilling into: ' + label);
            // simple drill - navigate to relevant page
            if (label.includes('HQ')) navigateTo('hq-performance');
            else if (label.includes('Gallery')) navigateTo('gallery-performance');
            else if (label.includes('District')) navigateTo('district-performance');
            else if (label.includes('Employee')) navigateTo('team-performance');
            else if (label.includes('Lead')) navigateTo('leads');
            else if (label.includes('Task')) navigateTo('tasks');
            else if (label.includes('Complaint')) navigateTo('complaints');
            else if (label.includes('Collection')) navigateTo('collections');
        }

        // ================================================================
        // SEARCH
        // ================================================================
        document.getElementById('globalSearch').addEventListener('input', function(e) {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { renderPage(currentPage); return; }
            const all = [...AppData.galleries, ...AppData.employees, ...AppData.districts, ...AppData.hqs];
            const results = all.filter(item => JSON.stringify(item).toLowerCase().includes(q));
            showToast(`🔍 Found ${results.length} matches`);
        });

        // ================================================================
        // NOTIFICATIONS
        // ================================================================
        document.getElementById('notifBtn').addEventListener('click', function() {
            const badge = document.getElementById('notifBadge');
            if (badge.textContent !== '0') {
                badge.textContent = '0';
                showToast('📬 Notifications cleared');
            } else {
                showToast('🔔 No new notifications');
            }
        });

        // ================================================================
        // SWITCH ROLE
        // ================================================================
        document.getElementById('switchRoleBtn').addEventListener('click', function() {
            const name = document.getElementById('userNameDisplay');
            if (name.textContent === 'Vikram') {
                name.textContent = 'Admin';
                showToast('🔄 Switched to Admin');
            } else {
                name.textContent = 'Vikram';
                showToast('🔄 Switched to HQ Head');
            }
        });

        // ================================================================
        // INIT
        // ================================================================
        loadData();
        renderSidebar();
        renderPage('dashboard');

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 HQ Head Dashboard loaded');
        console.log('💾 Data:', AppData);
    </script>

    <!-- Firebase SDK -->

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

    <!-- CRM Services -->

    <script src="email-service.js"></script>
    <script src="calling-service.js"></script>
    <script src="firebase-init.js"></script>

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
