            animation: fadeIn 0.25s ease-out;

            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0b0f19;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            color: #34d399;
            font-size: 18px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);

            align-items: center;
            justify-content: center;

            pointer-events: none;
            transition: opacity 0.25s;

        .modal-overlay.active {
            opacity: 1;

        }
        .modal-box {

            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    AppData = JSON.parse(stored);
                    // Ensure arrays
                    if (!AppData.visits) AppData.visits = [];
                    if (!AppData.prospects) AppData.prospects = [];
                    if (!AppData.leads) AppData.leads = [];
                    if (!AppData.opportunities) AppData.opportunities = [];
                    if (!AppData.customers) AppData.customers = [];
                    if (!AppData.meetings) AppData.meetings = [];
                    if (!AppData.followups) AppData.followups = [];
                    if (!AppData.dailyReports) AppData.dailyReports = [];
                    if (!AppData.surveys) AppData.surveys = [];
                    if (!AppData.intelligence) AppData.intelligence = [];
                    if (!AppData.tasks) AppData.tasks = [];
                    if (!AppData.travelExpenses) AppData.travelExpenses = [];
                    if (!AppData.stats) AppData.stats = {};
                    if (!AppData.user) AppData.user = { name: 'Meena', role: 'BDO', territory: 'North Zone' };
                    updateStats();
                    saveData();
                } else {
                    initDefaultData();
                    saveData();
                }
            } catch (e) {
                console.warn('Data load error, resetting', e);
                initDefaultData();
                saveData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(AppData));
            } catch (e) {}
        }

        function updateStats() {

            const leads = AppData.leads || [];
            const opportunities = AppData.opportunities || [];
            const customers = AppData.customers || [];
            const followups = AppData.followups || [];
            const tasks = AppData.tasks || [];
            const surveys = AppData.surveys || [];
            const today = new Date().toISOString().slice(0, 10);

            const plannedVisits = visits.length;
            const completedVisits = visits.filter(v => v.status === 'Completed').length;
            const missedVisits = visits.filter(v => v.status === 'Missed').length;
            const verifiedVisits = visits.filter(v => v.verified).length;
            const pendingVisits = visits.filter(v => v.status === 'Pending' || v.status === 'Scheduled').length;
            const prospectsVisited = prospects.filter(p => p.status === 'Contacted' || p.status === 'Qualified').length;

        // ================================================================
        // UTILITY
        // ================================================================
        function formatNum(n) {
            if (n >= 10000000) return (n / 10000000).toFixed(1) + 'Cr';
            if (n >= 100000) return (n / 100000).toFixed(1) + 'L';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return n;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function quickAction(action) {
            if (action === 'Record Visit') openModal('visit');
            else if (action === 'New Prospect') openModal('prospect');
            else if (action === 'New Lead') openModal('lead');
            else if (action === 'Schedule Meeting') openModal('meeting');
            else if (action === 'Add Follow-up') openModal('followup');
            else if (action === 'Market Survey') openModal('survey');
            else if (action === 'Submit Daily Report') openModal('dailyReport');
            else if (action === 'Add Expense') openModal('travelExpense');
            else showToast('⚡ ' + action);
        }

        function drill(label) {
            showToast('🔍 Drilling into: ' + label);
            if (label.includes('Visit')) navigateTo('visits');
            else if (label.includes('Territory')) navigateTo('territory');
            else if (label.includes('Prospect')) navigateTo('prospects');
            else if (label.includes('Lead')) navigateTo('leads');
            else if (label.includes('Opportunity')) navigateTo('opportunities');
            else if (label.includes('Customer')) navigateTo('customers');
            else if (label.includes('Meeting')) navigateTo('meetings');
            else if (label.includes('Follow-up')) navigateTo('followups');
            else if (label.includes('Survey')) navigateTo('surveys');
            else if (label.includes('Task')) navigateTo('tasks');
            else if (label.includes('Performance')) navigateTo('performance');
            else if (label.includes('Revenue') || label.includes('Target') || label.includes('Business')) navigateTo(
            'performance');
        }

        // ================================================================
        // SEARCH
        // ================================================================
        document.getElementById('globalSearch').addEventListener('input', function(e) {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { renderPage(currentPage); return; }
            const all = [...AppData.visits, ...AppData.prospects, ...AppData.leads, ...AppData.customers];
            const results = all.filter(item => JSON.stringify(item).toLowerCase().includes(q));
            showToast(`🔍 Found ${results.length} matches`);
        });

    <!-- CRM Services -->

    <script src="email-service.js"></script>
    <script src="calling-service.js"></script>
    <script src="firebase-init.js"></script>

    <!-- Logout Handler Script -->
    <script>
    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('✅ Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('❌ Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('✅ User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('✅ CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('❌ CRM services error:', e.detail);
    });
    </script>
